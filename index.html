<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>英语精听播放器 v1.6.4 (iPhone7适配)</title>
    <style>
        :root {
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-text: #000000;
            --ios-subtext: #8e8e93;
            --ios-blue: #007aff;
            --ios-red: #ff3b30;
            --ios-orange: #ff9500;
            --ios-gray-btn: #eef0f4;
            --ios-blur: rgba(255, 255, 255, 0.95);
            --ios-radius: 12px;
            --safe-top: env(safe-area-inset-top, 24px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background-color: var(--ios-bg); color: var(--ios-text);
            display: flex; flex-direction: column;
            user-select: none; -webkit-user-select: none;
        }

        /* --- 顶部导航 --- */
        .header {
            background-color: var(--ios-blur);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            padding: calc(var(--safe-top) + 8px) 15px 8px 15px; /* 稍微减小顶部内边距 */
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            z-index: 100;
            flex-shrink: 0; 
        }
        .path-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .back-btn { color: var(--ios-blue); font-size: 17px; font-weight: 500; background: none; border: none; cursor: pointer; display: flex; align-items: center; }
        .current-folder { font-size: 17px; font-weight: 700; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .search-bar { background-color: rgba(118, 118, 128, 0.12); border-radius: 10px; padding: 6px 12px; display: flex; align-items: center; }
        .search-input { border: none; background: transparent; width: 100%; font-size: 16px; margin-left: 6px; outline: none; }

        /* --- 列表区域 --- */
        .content {
            flex: 1; 
            overflow-y: auto; 
            /* 关键修复：从380px减小到260px，给iPhone 7腾出空间 */
            padding: 10px 16px 260px 16px; 
            -webkit-overflow-scrolling: touch; 
            position: relative; 
        }
        
        .list-group { 
            background-color: var(--ios-card); 
            border-radius: var(--ios-radius); 
            overflow: hidden; 
        }
        
        .list-item {
            display: flex; align-items: center; padding: 14px 16px; /* 稍微减小列表项高度 */
            background-color: var(--ios-card); border-bottom: 0.5px solid rgba(0,0,0,0.08);
            cursor: pointer; position: relative;
        }
        
        .list-item:active { background-color: #e5e5ea; }
        .list-item.active .item-title { color: var(--ios-blue); font-weight: 600; }
        .list-item.pinned-item { background-color: rgba(0, 122, 255, 0.05); }
        .list-item.dragging { opacity: 0.5; background-color: #eefeff; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .drag-handle { color: #ccc; margin-right: 12px; font-size: 20px; cursor: grab; padding: 5px; touch-action: none; }
        .item-icon { font-size: 20px; margin-right: 12px; width: 24px; text-align: center; }
        .item-info { flex: 1; overflow: hidden; }
        .item-title { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #000; }
        .item-subtext { font-size: 11px; color: var(--ios-subtext); margin-top: 2px; }

        .item-fav-heart { padding: 10px; font-size: 20px; color: #ddd; transition: 0.2s; }
        .item-fav-heart.active { color: var(--ios-red); }

        /* --- 底部播放器 (紧凑优化版) --- */
        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: var(--ios-card); border-top: 0.5px solid rgba(0,0,0,0.1);
            /* 减小内边距 */
            padding: 10px 0 calc(10px + var(--safe-bottom)) 0; 
            z-index: 200; box-shadow: 0 -8px 30px rgba(0,0,0,0.08);
        }

        /* 减小各个控件的下边距，挤出空间 */
        .slider-container { padding: 0 20px; margin-bottom: 10px; position: relative; }
        .ios-slider { -webkit-appearance: none; width: 100%; height: 5px; background: #d1d1d6; border-radius: 3px; outline: none; cursor: pointer; }
        .ios-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: white; border-radius: 50%; box-shadow: 0 3px 8px rgba(0,0,0,0.2); }

        .track-display { text-align: center; padding: 0 20px; margin-bottom: 8px; min-height: 40px; }
        .track-name { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #000; margin-bottom: 2px; }
        .track-time { font-size: 11px; color: var(--ios-subtext); font-variant-numeric: tabular-nums; }
        .lyric-placeholder { font-size: 12px; color: var(--ios-blue); margin-top: 4px; height: 14px; }

        /* 使用 margin 替代 gap 以兼容 iOS 12 */
        .learning-controls { display: flex; justify-content: center; align-items: center; margin-bottom: 12px; }
        .learn-btn { background: none; border: none; color: #333; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 600; margin: 0 25px; /* 使用 margin */ }
        .learn-btn svg { width: 26px; height: 26px; margin-bottom: 2px; }

        .basic-controls { display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        /* 图标稍微调小适配小屏 */
        .play-btn svg { width: 42px; height: 42px; }
        .side-btn svg { width: 26px; height: 26px; }
        .player-fav-heart { font-size: 24px; color: #d1d1d6; cursor: pointer; }
        .player-fav-heart.active { color: var(--ios-red); }
        
        /* 手动控制间距兼容旧版 */
        .basic-controls > * { margin: 0 12px; }

        .feature-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 0 10px; }
        .pill-btn { background-color: var(--ios-gray-btn); border: none; border-radius: 8px; padding: 8px 0; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; transition: 0.2s; }
        .pill-btn.active { background-color: rgba(0, 122, 255, 0.1); color: var(--ios-blue); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 1000; display: none; align-items: flex-end; justify-content: center; }
        .playlist-modal { background: var(--ios-card); width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 20px 0 calc(20px + var(--safe-bottom)) 0; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        #toast { position: fixed; top: 25%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 12px 24px; border-radius: 25px; font-size: 15px; z-index: 2000; display: none; }
        .version-tag { font-size: 10px; color: #c6c6c8; text-align: center; margin-top: 10px; font-weight: 500; }
        
        #noSleepVideo { display: none; width: 1px; height: 1px; }
    </style>
</head>
<body>

    <audio id="audioPlayer"></audio>
    <video id="noSleepVideo" loop muted playsinline src="data:video/mp4;base64,AAAAHGZ0eXBpc29tAAACAGlzb21pc28yYXZjMQAAAAhmcmVlAAAAG21kYXQAAAGzABAHAAABthAwwgRUwu11AAIAAAFVbW9vdgAAAGxtdmhkAAAAAMw11LPMNdSzAAACWAAAAKAAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAANh0cmFrAAAAXHRraGQAAAADzDXUs8w11LMAAAABAAAAAAAoAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAQAAAAAEAAAABAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAACgAAAAAAABAAAAAAHcbWRpYQAAACBtZGhkAAAAAMw11LPMNdSzAAACWAAAAKBBVxAAAAAAAC1oZGxyAAAAAAAAAAB2aWRlAAAAAAAAAAAAAAAAVmlkZW9IYW5kbGVyAAAAAVBtaW5mAAAAFHZtaGQAAAABAAAAAAAAAAAAAAAkZGluZgAAABxkcmVmAAAAAAAAAAEAAAAMdXJsIAAAAAEAAADsc3RibAAAALhzdHNkAAAAAAAAAAEAAACoYXZjMQAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAABAAABAEgAAABIAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAoAP//AAAAQmF2Y0MAAgwL//tYn/4CAwz+/v7+///+gP20P/11AABaOAAACtAAAeEAAQAAAAMAAgAAAwQAAAIAC7x+OQAEAEQAEQAAAQABAAABvWcAAAAQc3R0cwAAAAAAAAABAAAAAQAAAKAAAAAUc3RzcwAAAAAAAAABAAAAAQAAABxzdHNjAAAAAAAAAAEAAAABAAAAAQAAAAEAAAAUc3RzejAAAAAAAAAAAAAAAQAAABIAAAAUc3RjbwAAAAAAAAABAAAAMAAAAGB1ZHRhAAAAWG1ldGEAAAAAAAAAIWhkbHIAAAAAAAAAAG1kaXJhcHBsAAAAAAAAAAAAAAAAK2lsc3QAAAAjqXRvbwAAABtkYXRhAAAAAQAAAABMYXZmNTkuMjcuMTAw"></video>
    <div id="toast">提示</div>

    <!-- 收藏夹弹窗 -->
    <div class="modal-overlay" id="playlistModal" onclick="if(event.target===this) closePlaylistModal()">
        <div class="playlist-modal">
            <div style="font-size:18px; font-weight:700; text-align:center; margin-bottom:15px;">添加到收藏夹</div>
            <div id="playlistOptions" style="overflow-y:auto; max-height:45vh;"></div>
            <div style="padding:16px 25px; border-top:0.5px solid #eee; color:var(--ios-blue); font-weight:600; font-size:17px;" onclick="createNewPlaylistFromModal()">➕ 新建收藏夹...</div>
            <div style="padding:16px 25px; text-align:center; color:var(--ios-red); font-weight:600;" onclick="closePlaylistModal()">取消</div>
        </div>
    </div>

    <!-- 顶部 -->
    <div class="header">
        <div class="path-nav">
            <button class="back-btn" onclick="goBack()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                返回
            </button>
            <div class="current-folder" id="currentFolder">/</div>
            <div style="width: 40px;"></div>
        </div>
        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索列表歌曲..." oninput="filterList()">
        </div>
    </div>

    <!-- 内容区域 -->
    <div class="content" id="scrollContent">
        <div class="list-group" id="fileList"></div>
    </div>

    <!-- 底部播放器 -->
    <div class="player-bar">
        <div class="slider-container" id="sliderContainer">
            <input type="range" class="ios-slider" id="progressSlider" value="0" step="0.01">
        </div>

        <div class="track-display" id="touchSeekArea">
            <div class="track-name" id="trackName">未播放</div>
            <div class="track-time" id="trackTime">00:00 / 00:00</div>
            <div class="lyric-placeholder" id="lyricLabel"></div>
        </div>

        <div class="learning-controls">
            <button class="learn-btn" onclick="seekRelative(-15)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14l-4-4 4-4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/></svg>15s</button>
            <button class="learn-btn ab-btn" id="abBtn" onclick="handleABRepeat()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v2H7zM7 11h10v2H7zM7 15h10v2H7z"/></svg><span id="abText">A-B重复</span></button>
            <button class="learn-btn" onclick="seekRelative(15)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l4-4-4-4"/><path d="M19 10H8a4 4 0 1 0 0 8h1"/></svg>15s</button>
        </div>

        <div class="basic-controls">
            <button class="icon-btn side-btn" id="loopBtn" onclick="toggleLoop()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
            <button class="icon-btn side-btn" onclick="playPrev()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
            <button class="icon-btn play-btn" onclick="togglePlay()"><svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
            <button class="icon-btn side-btn" onclick="playNext()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            <div class="player-fav-heart" id="mainFavBtn" onclick="openPlaylistModal()">🤍</div>
        </div>

        <div class="feature-grid">
            <button class="pill-btn" id="speedBtn" onclick="changeSpeed()"><span>⚡️</span><span>1.0x</span></button>
            <button class="pill-btn" id="wakeLockBtn" onclick="toggleWakeLock()"><span>💡</span><span>常亮关</span></button>
            <button class="pill-btn" id="timerBtn" onclick="setTimer()"><span>🌙</span><span>定时</span></button>
            <button class="pill-btn" onclick="fetchDirectory('virtual:folders')"><span>📂</span><span>收藏</span></button>
            <button class="pill-btn" onclick="refreshList()"><span>🔄</span><span>刷新</span></button>
        </div>
        <div class="version-tag">Build v1.6.4</div>
    </div>

    <script>
        const SITE_ROOT = 'https://res.evanyin.dpdns.org/';
        const AUDIO_EXTS = ['.mp3', '.wav', '.flac', '.m4a', '.aac', '.ogg'];

        // 默认直接加载根目录
        let currentPath = SITE_ROOT; 
        let fileList = [], playList = [], currentTrackIndex = -1;
        let loopMode = 'list', playbackRate = 1.0, sleepTimer = null, abA = null, abB = null;

        let playlists = JSON.parse(localStorage.getItem('my_playlists_v3') || '{}');
        let progressDB = JSON.parse(localStorage.getItem('audio_progress_v2') || '{}');

        const audio = document.getElementById('audioPlayer');
        const slider = document.getElementById('progressSlider');
        const noSleepVideo = document.getElementById('noSleepVideo');
        
        let isWakeLockEnabled = false;
        let wakeLockObj = null;

        const ui = {
            list: document.getElementById('fileList'),
            folder: document.getElementById('currentFolder'),
            trackName: document.getElementById('trackName'),
            trackTime: document.getElementById('trackTime'),
            playIcon: document.getElementById('iconPlay'),
            pauseIcon: document.getElementById('iconPause'),
            abBtn: document.getElementById('abBtn'), abText: document.getElementById('abText'),
            speedBtn: document.getElementById('speedBtn'), timerBtn: document.getElementById('timerBtn'),
            wakeLockBtn: document.getElementById('wakeLockBtn'),
            mainFavBtn: document.getElementById('mainFavBtn'),
            modal: document.getElementById('playlistModal'), modalOptions: document.getElementById('playlistOptions')
        };

        document.addEventListener('DOMContentLoaded', () => { fetchDirectory(currentPath); setupAudioEvents(); setupSliderJump(); });

        function setupSliderJump() {
            const container = document.getElementById('sliderContainer');
            container.addEventListener('click', (e) => {
                if (e.target === slider) return; 
                const rect = slider.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                if (audio.duration) {
                    audio.currentTime = pos * audio.duration;
                    saveProgress();
                }
            });
            slider.addEventListener('change', () => {
                if (audio.duration) {
                    audio.currentTime = (slider.value / 100) * audio.duration;
                    saveProgress();
                }
            });
        }

        // --- 屏幕常亮逻辑 ---
        async function toggleWakeLock() {
            isWakeLockEnabled = !isWakeLockEnabled;
            if (isWakeLockEnabled) {
                ui.wakeLockBtn.classList.add('active');
                ui.wakeLockBtn.querySelector('span:last-child').textContent = "常亮开";
                if ('wakeLock' in navigator) {
                    try {
                        wakeLockObj = await navigator.wakeLock.request('screen');
                        wakeLockObj.addEventListener('release', () => {
                            if(isWakeLockEnabled && document.visibilityState === 'visible') {
                                navigator.wakeLock.request('screen').then(wl => wakeLockObj = wl).catch(e=>{});
                            }
                        });
                    } catch (e) { console.log("WakeLock API 失败:", e); }
                }
                noSleepVideo.play().catch(e => console.log("视频保活失败:", e));
                showToast("已开启屏幕常亮");
            } else {
                ui.wakeLockBtn.classList.remove('active');
                ui.wakeLockBtn.querySelector('span:last-child').textContent = "常亮关";
                if (wakeLockObj) { wakeLockObj.release(); wakeLockObj = null; }
                noSleepVideo.pause();
                showToast("已关闭屏幕常亮");
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (isWakeLockEnabled && document.visibilityState === 'visible' && 'wakeLock' in navigator) {
                try { wakeLockObj = await navigator.wakeLock.request('screen'); } catch(e){}
            }
        });

        // --- 收藏逻辑 ---
        function openPlaylistModal() {
            const track = playList[currentTrackIndex];
            if (!track) return showToast("请先播放歌曲");
            ui.modal.style.display = 'flex';
            ui.modalOptions.innerHTML = '';
            Object.keys(playlists).forEach(name => {
                const opt = document.createElement('div');
                opt.style = "padding:16px 25px; border-bottom:0.5px solid #eee; display:flex; align-items:center; gap:12px; font-size:17px;";
                const isAlreadyIn = playlists[name].some(f => f.url === track.url);
                opt.innerHTML = `<span>📁</span> <span style="flex:1">${name}</span> ${isAlreadyIn ? '<span style="color:var(--ios-blue);">✓</span>' : ''}`;
                opt.onclick = () => addToPlaylist(name);
                ui.modalOptions.appendChild(opt);
            });
        }
        function closePlaylistModal() { ui.modal.style.display = 'none'; }
        function addToPlaylist(name) {
            const track = playList[currentTrackIndex];
            const list = playlists[name];
            const idx = list.findIndex(f => f.url === track.url);
            if (idx > -1) { list.splice(idx, 1); showToast(`从【${name}】移除`); }
            else { list.push(track); showToast(`已加入【${name}】`); }
            savePlaylists(); updateFavHeart(); closePlaylistModal();
            if (currentPath.startsWith('virtual:list:')) renderTracksInPlaylist(name);
        }
        function createNewPlaylistFromModal() {
            const name = prompt("请输入新收藏夹名称:");
            if (name && name.trim()) {
                const cleanName = name.trim();
                if (!playlists[cleanName]) playlists[cleanName] = [];
                addToPlaylist(cleanName);
            }
        }
        function updateFavHeart() {
            const track = playList[currentTrackIndex];
            if (!track) return;
            const isInAny = Object.values(playlists).some(list => list.some(f => f.url === track.url));
            ui.mainFavBtn.textContent = isInAny ? "❤️" : "🤍";
            ui.mainFavBtn.classList.toggle('active', isInAny);
        }
        function toggleQuickFav(e, trackEncoded) {
            e.stopPropagation();
            const track = JSON.parse(decodeURIComponent(trackEncoded));
            const targetLists = Object.keys(playlists).filter(name => playlists[name].some(f => f.url === track.url));
            if (targetLists.length > 0) {
                targetLists.forEach(name => { playlists[name] = playlists[name].filter(f => f.url !== track.url); });
                showToast("已取消收藏");
            } else {
                const idx = playList.findIndex(p => p.url === track.url);
                if(idx > -1) currentTrackIndex = idx;
                openPlaylistModal();
                return;
            }
            savePlaylists(); updateFavHeart(); filterList();
        }
        function savePlaylists() { localStorage.setItem('my_playlists_v3', JSON.stringify(playlists)); }

        // --- 目录解析 ---
        async function fetchDirectory(url) {
            if (url === 'virtual:folders') return renderPlaylistFolders();
            if (url.startsWith('virtual:list:')) return renderTracksInPlaylist(url.replace('virtual:list:', ''));
            currentPath = url;
            ui.list.innerHTML = '<div style="text-align:center;padding:20px;color:gray;">连接中...</div>';
            
            // UI 显示路径计算，根目录补全 '/'
            ui.folder.textContent = url.replace(SITE_ROOT, '/');
            if(ui.folder.textContent === '') ui.folder.textContent = '/';

            try {
                const response = await fetch(url);
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const links = Array.from(doc.querySelectorAll('.name-col a, a'));
                fileList = []; playList = [];
                links.forEach(a => {
                    const href = a.getAttribute('href');
                    const text = a.textContent.trim();
                    if(!href || href === '../' || href === './' || text.includes('Parent Directory')) return;
                    const fullUrl = new URL(href, url).href;
                    const name = decodeURIComponent(text.replace(/[📁📄]/g, '').replace(/\/$/, '').trim());
                    const isFolder = href.endsWith('/');
                    const isAudio = AUDIO_EXTS.some(ext => name.toLowerCase().endsWith(ext));
                    if(isFolder || isAudio) {
                        const item = { name, url: fullUrl, isFolder, isAudio };
                        fileList.push(item);
                        if(isAudio) playList.push(item);
                    }
                });
                renderList(fileList);
            } catch (err) { ui.list.innerHTML = '无法连接服务器'; }
        }

        function renderList(items, isPlaylist = false) {
            ui.list.innerHTML = '';
            if (currentPath !== 'virtual:folders' && !currentPath.startsWith('virtual:list:')) {
                const favEntry = document.createElement('div');
                favEntry.className = 'list-item pinned-item';
                favEntry.onclick = () => fetchDirectory('virtual:folders');
                favEntry.innerHTML = `<div class="item-icon">⭐️</div><div class="item-info"><div class="item-title">我的收藏夹</div></div>`;
                ui.list.appendChild(favEntry);
            }
            if (!isPlaylist) items.sort((a,b) => (a.isFolder === b.isFolder ? a.name.localeCompare(b.name) : a.isFolder ? -1 : 1));
            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                if(currentTrackIndex >= 0 && playList[currentTrackIndex] && playList[currentTrackIndex].url === item.url) div.classList.add('active');
                const isFav = Object.values(playlists).some(list => list.some(f => f.url === item.url));
                const prog = progressDB[item.url];
                const sub = prog > 2 ? `<div class="item-subtext">上次听到 ${formatTime(prog)}</div>` : "";
                div.innerHTML = `
                    ${isPlaylist ? '<div class="drag-handle">≡</div>' : ''}
                    <div class="item-icon">${item.isFolder ? '📁' : '🎵'}</div>
                    <div class="item-info"><div class="item-title">${item.name}</div>${sub}</div>
                    ${item.isAudio ? `<div class="item-fav-heart ${isFav?'active':''}" onclick="toggleQuickFav(event, '${encodeURIComponent(JSON.stringify(item))}')">${isFav?'❤️':'🤍'}</div>` : ''}
                `;
                div.onclick = (e) => {
                    if (e.target.closest && (e.target.closest('.item-fav-heart') || e.target.closest('.drag-handle'))) return;
                    item.isFolder ? fetchDirectory(item.url) : playTrack(playList.findIndex(p => p.url === item.url));
                };
                if (isPlaylist) setupDragSort(div);
                ui.list.appendChild(div);
            });
        }

        function renderPlaylistFolders() {
            currentPath = 'virtual:folders';
            ui.folder.textContent = '/我的收藏';
            ui.list.innerHTML = `<div class="list-item pinned-item active"><div class="item-icon">⭐️</div><div class="item-info"><div class="item-title">收藏文件夹列表</div></div></div>`;
            Object.keys(playlists).forEach(name => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `<div class="item-icon">📁</div><div class="item-info"><div class="item-title">${name}</div><div class="item-subtext">${playlists[name].length} 首曲目</div></div><div style="font-size:12px; color:var(--ios-blue)" onclick="event.stopPropagation(); renamePlaylist('${name}')">重命名</div><div style="font-size:12px; color:var(--ios-red); margin-left:10px;" onclick="event.stopPropagation(); deletePlaylist('${name}')">删除</div>`;
                div.onclick = () => fetchDirectory(`virtual:list:${name}`);
                ui.list.appendChild(div);
            });
        }

        function renderTracksInPlaylist(name) {
            currentPath = `virtual:list:${name}`;
            ui.folder.textContent = `/收藏/${name}`;
            playList = playlists[name] || [];
            ui.list.innerHTML = `<div class="list-item pinned-item" onclick="fetchDirectory('virtual:folders')"><div class="item-icon">⬅️</div><div class="item-info"><div class="item-title">返回文件夹列表</div></div></div>`;
            renderList(playList, true);
        }

        function playTrack(index) {
            if(index < 0 || index >= playList.length) return;
            currentTrackIndex = index;
            const track = playList[index];
            if (audio.src === track.url) return togglePlay();
            audio.src = track.url;
            audio.playbackRate = playbackRate;
            ui.trackName.textContent = track.name;
            resetAB();
            updateFavHeart();
            filterList();
            const savedTime = progressDB[track.url] || 0;
            const attemptJump = () => {
                if (savedTime > 2) {
                    audio.currentTime = savedTime;
                    showToast(`恢复进度: ${formatTime(savedTime)}`);
                }
            };
            audio.addEventListener('loadedmetadata', attemptJump, { once: true });
            audio.play().catch(e => console.log("等待手势触发播放"));
        }

        function togglePlay() {
            if(!audio.src) { if(playList.length > 0) playTrack(0); return; }
            audio.paused ? audio.play() : audio.pause();
        }

        function saveProgress() {
            if (audio.src && audio.currentTime > 0) {
                progressDB[audio.src] = audio.currentTime;
                localStorage.setItem('audio_progress_v2', JSON.stringify(progressDB));
            }
        }

        function setupAudioEvents() {
            audio.addEventListener('play', () => { ui.playIcon.style.display = 'none'; ui.pauseIcon.style.display = 'block'; });
            audio.addEventListener('pause', () => { ui.playIcon.style.display = 'block'; ui.pauseIcon.style.display = 'none'; saveProgress(); });
            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    if (!slider.dragging) slider.value = (audio.currentTime / audio.duration) * 100;
                    ui.trackTime.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
                    if (abA !== null && abB !== null && audio.currentTime >= abB) audio.currentTime = abA;
                    if (Math.floor(audio.currentTime) % 1 === 0) saveProgress();
                }
            });
            slider.addEventListener('input', () => { slider.dragging = true; });
            slider.addEventListener('mouseup', () => { slider.dragging = false; });
            slider.addEventListener('touchend', () => { slider.dragging = false; });
            audio.addEventListener('ended', () => { delete progressDB[audio.src]; localStorage.setItem('audio_progress_v2', JSON.stringify(progressDB)); loopMode === 'single' ? playTrack(currentTrackIndex) : playNext(); });
        }

        let dragSrcEl = null;

        function handleDragStart(e, el) {
            dragSrcEl = el;
            el.classList.add('dragging');
            window.addEventListener('mousemove', handleDragMove);
            window.addEventListener('touchmove', handleDragMove, {passive: false});
            window.addEventListener('mouseup', handleDragEnd);
            window.addEventListener('touchend', handleDragEnd);
        }

        function handleDragMove(e) {
            if (!dragSrcEl) return;
            e.preventDefault(); 
            const touch = e.type === 'touchmove' ? e.touches[0] : e;
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            const overEl = (target && target.closest) ? target.closest('.list-item') : null;
            if (overEl && overEl !== dragSrcEl && !overEl.classList.contains('pinned-item')) {
                const rect = overEl.getBoundingClientRect();
                const next = (touch.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                ui.list.insertBefore(dragSrcEl, next ? overEl.nextSibling : overEl);
            }
        }

        function handleDragEnd(e) {
            if (!dragSrcEl) return;
            dragSrcEl.classList.remove('dragging');
            window.removeEventListener('mousemove', handleDragMove);
            window.removeEventListener('touchmove', handleDragMove);
            window.removeEventListener('mouseup', handleDragEnd);
            window.removeEventListener('touchend', handleDragEnd);

            const playlistName = currentPath.replace('virtual:list:', '');
            const newOrder = [];
            ui.list.querySelectorAll('.list-item:not(.pinned-item)').forEach(item => {
                const title = item.querySelector('.item-title').textContent;
                const track = playlists[playlistName].find(t => t.name === title);
                if(track) newOrder.push(track);
            });
            playlists[playlistName] = newOrder; 
            savePlaylists(); 
            playList = newOrder;
            dragSrcEl = null;
        }

        function setupDragSort(el) {
            const handle = el.querySelector('.drag-handle');
            handle.addEventListener('mousedown', (e) => handleDragStart(e, el));
            handle.addEventListener('touchstart', (e) => handleDragStart(e, el));
        }

        // --- 辅助功能 ---
        function deletePlaylist(name) { if (confirm(`删除【${name}】?`)) { delete playlists[name]; savePlaylists(); renderPlaylistFolders(); updateFavHeart(); } }
        function renamePlaylist(oldName) { const n = prompt("重命名:", oldName); if (n && n.trim() && n !== oldName) { playlists[n.trim()] = playlists[oldName]; delete playlists[oldName]; savePlaylists(); renderPlaylistFolders(); } }
        function seekRelative(sec) { audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec)); saveProgress(); }
        function handleABRepeat() {
            if (abA === null) { abA = audio.currentTime; ui.abBtn.classList.add('active'); ui.abText.textContent = "设为B点"; }
            else if (abB === null) { abB = audio.currentTime; if (abB <= abA) { abB = null; return; } ui.abText.textContent = "循环中"; audio.currentTime = abA; }
            else { abA = null; abB = null; ui.abBtn.classList.remove('active'); ui.abText.textContent = "A-B重复"; }
        }
        function resetAB() { abA = null; abB = null; ui.abBtn.classList.remove('active'); ui.abText.textContent = "A-B重复"; }
        function formatTime(s) { const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1500); }
        function changeSpeed() {
            const speeds = [1.0, 1.25, 1.5, 2.0, 0.8];
            playbackRate = speeds[(speeds.indexOf(playbackRate) + 1) % speeds.length];
            audio.playbackRate = playbackRate;
            ui.speedBtn.querySelector('span:last-child').textContent = `${playbackRate}x`;
            ui.speedBtn.classList.toggle('active', playbackRate !== 1.0);
        }
        function toggleLoop() {
            loopMode = (loopMode === 'list') ? 'single' : 'list';
            document.getElementById('loopBtn').style.color = loopMode === 'single' ? 'var(--ios-blue)' : '#000';
            showToast(loopMode === 'single' ? "单曲循环" : "列表循环");
        }
        function playNext() { playTrack((currentTrackIndex + 1) % playList.length); }
        function playPrev() { playTrack((currentTrackIndex - 1 + playList.length) % playList.length); }
        function goBack() {
            if (currentPath.startsWith('virtual:list:')) return fetchDirectory('virtual:folders');
            if (currentPath === 'virtual:folders') return fetchDirectory(SITE_ROOT);
            try {
                let u = new URL(currentPath);
                let p = u.pathname.split('/').filter(x=>x); p.pop();
                fetchDirectory(u.origin + '/' + p.join('/') + (p.length? '/' : ''));
            } catch (e) { fetchDirectory(SITE_ROOT); }
        }
        function filterList() {
            if (currentPath === 'virtual:folders') renderPlaylistFolders();
            else if (currentPath.startsWith('virtual:list:')) renderTracksInPlaylist(currentPath.replace('virtual:list:', ''));
            else { const term = document.getElementById('searchInput').value.toLowerCase(); renderList(fileList.filter(i => i.name.toLowerCase().includes(term))); }
        }
        function refreshList() { fetchDirectory(currentPath); }
        document.getElementById('touchSeekArea').onclick = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            if (x < rect.width / 3) seekRelative(-15);
            else if (x > (rect.width * 2) / 3) seekRelative(15);
        };
        function setTimer() {
            const i = prompt("定时分钟:", "30");
            if (i && !isNaN(i)) {
                if (sleepTimer) clearTimeout(sleepTimer);
                ui.timerBtn.classList.add('active');
                sleepTimer = setTimeout(() => { audio.pause(); ui.timerBtn.classList.remove('active'); alert("定时停止"); }, parseFloat(i)*60000);
            }
        }
    </script>
</body>
</html>
