// ══════════════════════════════════════════════════════════
//  LISTENING STATS  v1.7.7
//
//  Storage:  stats_db_v1  →  { "YYYY-MM-DD": { urlHash: {name,url,sec} } }
//
//  Volume gate:
//    • audio.muted         → reliable everywhere
//    • audio.volume < 0.4  → reliable on Android/Windows/macOS/iOS*
//    Note: iOS system volume slider cannot be read by JS (Apple design).
//    AudioContext RMS was previously attempted but caused silent audio —
//    createMediaElementSource() hijacks the audio element output through
//    a suspended AudioContext. Removed in v1.7.7.
// ══════════════════════════════════════════════════════════
var statsDB   = {};
var _stFlush  = 0;
var MIN_VOL   = 0.4;

try { statsDB = JSON.parse(localStorage.getItem('stats_db_v1') || '{}'); } catch(e) {}

function isAudible() {
    if (audio.muted) return false;
    if (audio.volume < MIN_VOL) return false;
    return true;
}

// ── Stats Ticker: timeupdate delta (replaces setInterval) ──
// Using timeupdate avoids iOS background timer throttling.
// Delta-time approach stays accurate even when events are throttled.
var _lastAudioTime  = -1;   // last audio.currentTime seen
var _lastWallClock  = -1;   // performance.now() or Date.now() at that moment

function startStatsTicker() {
    audio.addEventListener('play', function() {
        // Reset reference points when playback (re)starts
        _lastAudioTime = audio.currentTime;
        _lastWallClock = _nowMs();
    }, false);

    audio.addEventListener('pause', function() {
        // Only commit if we were actually counting (audible) up to this pause
        if (isAudible()) _commitStatsDelta();
        _lastAudioTime = -1;
    }, false);

    audio.addEventListener('seeked', function() {
        // Discard stale reference after seeking to avoid giant delta
        _lastAudioTime = audio.currentTime;
        _lastWallClock = _nowMs();
    }, false);

    audio.addEventListener('timeupdate', function() {
        if (audio.paused) return;
        if (!isAudible()) {
            // Volume dropped below threshold – reset reference, don't count
            _lastAudioTime = audio.currentTime;
            _lastWallClock = _nowMs();
            return;
        }
        _commitStatsDelta();
    }, false);

    // Safety net: wall-clock fallback every 5 s for browsers that
    // suspend timeupdate while backgrounded (rare but possible)
    setInterval(function() {
        if (audio.paused || _lastWallClock < 0) return;
        if (!isAudible()) return;
        // If no timeupdate fired for > 3 s, use wall-clock delta
        var wall = _nowMs() - _lastWallClock;
        if (wall > 3000) _commitStatsDelta(true);
    }, 5000);
}

function _nowMs() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
}

function _commitStatsDelta(useWallClock) {
    if (_lastAudioTime < 0) return;
    var track = playList[currentTrackIndex];
    if (!track) return;

    var delta;
    if (useWallClock) {
        // Fallback: estimate from wall clock (capped at 10s for safety)
        delta = Math.min((_nowMs() - _lastWallClock) / 1000, 10);
    } else {
        delta = audio.currentTime - _lastAudioTime;
    }

    // Accept only plausible forward-progress deltas (0 < delta < 2s)
    // Larger values indicate seeks or page resuming from long sleep
    if (delta > 0 && delta < 2) {
        var today = todayKey();
        if (!statsDB[today]) statsDB[today] = {};
        var k = urlHash(track.url);
        if (!statsDB[today][k]) statsDB[today][k] = { name: track.name, url: track.url, sec: 0 };
        statsDB[today][k].sec += delta;  // fractional seconds, more accurate

        if (++_stFlush >= 30) { _stFlush = 0; flushStats(); }
    }

    _lastAudioTime = audio.currentTime;
    _lastWallClock = _nowMs();
}

// Auto-prune: keep only last 180 days of stats (well within 5 MB budget)
function pruneStatsDB() {
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 180);
    var cutKey = cutoff.getFullYear() + '-' + pad2(cutoff.getMonth()+1) + '-' + pad2(cutoff.getDate());
    var days   = Object.keys(statsDB);
    var pruned = 0;
    for (var i = 0; i < days.length; i++) {
        if (days[i] < cutKey) { delete statsDB[days[i]]; pruned++; }
    }
    return pruned;
}

// Auto-prune progress records older than 90 days
function pruneProgressDB() {
    var keys = Object.keys(progressDB);
    // progress keys are URLs; we can only size-trim, not date-trim
    // if > 500 entries, drop the oldest half (by insertion order approximation)
    if (keys.length > 500) {
        for (var i = 0; i < Math.floor(keys.length / 2); i++) delete progressDB[keys[i]];
    }
}

function flushStats() {
    try {
        localStorage.setItem('stats_db_v1', JSON.stringify(statsDB));
    } catch(e) {
        // QuotaExceededError: prune old data and retry once
        if (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)) {
            var pruned = pruneStatsDB();
            pruneProgressDB();
            try {
                localStorage.setItem('stats_db_v1',        JSON.stringify(statsDB));
                localStorage.setItem('audio_progress_v2',  JSON.stringify(progressDB));
                if (pruned > 0) showToast('已自动清理' + pruned + '天历史记录');
            } catch(e2) {
                // Still failing — notify user
                showToast('⚠️ 存储空间不足，请清理浏览器缓存');
            }
        }
    }
}

function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

// Week dates: Mon–Sun for a given offset (0=this week, -1=last…)
function getWeekDates(wOff) {
    var td  = new Date();
    var dow = td.getDay();
    var toM = (dow === 0) ? -6 : 1 - dow;
    var mon = new Date(td.getFullYear(), td.getMonth(), td.getDate() + toM + wOff * 7);
    var out = [];
    for (var i = 0; i < 7; i++) {
        var d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
        out.push(d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()));
    }
    return out;
}

function fmtMD(k) { return k.slice(5).replace('-', '.'); }
function fmtHM(sec) {
    sec = Math.floor(sec);
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    if (h > 0 && m > 0) return h + '小时' + m + '分钟';
    if (h > 0)          return h + '小时';
    return m + '分钟';
}

function urlHash(url) {
    var h = 5381;
    for (var i = 0; i < url.length; i++) h = ((h << 5) + h) ^ url.charCodeAt(i);
    return String(h >>> 0);
}

function getCumulativeTotal() {
    var tot = 0, days = Object.keys(statsDB);
    for (var i = 0; i < days.length; i++) {
        var ks = Object.keys(statsDB[days[i]]);
        for (var j = 0; j < ks.length; j++) tot += statsDB[days[i]][ks[j]].sec;
    }
    return Math.floor(tot);
}
function getDaySec(key) {
    var day = statsDB[key] || {}, s = 0, ks = Object.keys(day);
    for (var i = 0; i < ks.length; i++) s += day[ks[i]].sec;
    return Math.floor(s);
}
function getDayTracks(key) {
    var day = statsDB[key] || {}, ks = Object.keys(day), arr = [];
    for (var i = 0; i < ks.length; i++) {
        var e = day[ks[i]];
        if (e.sec >= 1) arr.push({ name: e.name, url: e.url, sec: Math.floor(e.sec) });
    }
    arr.sort(function(a,b){ return b.sec - a.sec; });
    return arr;
}

// ── Open / Close ────────────────────────────────────────
var _stWeekOff = 0;
var _stSelDay  = null;

function openStats() {
    flushStats();
    _stWeekOff = 0;
    _stSelDay  = todayKey();
    document.getElementById('statsSheet').className = 'stats-sheet open';
    renderStats();
}
function closeStats() {
    document.getElementById('statsSheet').className = 'stats-sheet';
    flushStats();
}

// ── Main render ─────────────────────────────────────────
function renderStats() {
    var body   = document.getElementById('stBody');
    var dates  = getWeekDates(_stWeekOff);
    if (_stSelDay === null || dates.indexOf(_stSelDay) < 0) _stSelDay = dates[0];

    var values = [];
    for (var i = 0; i < 7; i++) values.push(Math.round(getDaySec(dates[i]) / 60));

    var thisWeekSec = 0, prevDates = getWeekDates(_stWeekOff - 1), prevWeekSec = 0;
    for (var i = 0; i < 7; i++) {
        thisWeekSec += getDaySec(dates[i]);
        prevWeekSec += getDaySec(prevDates[i]);
    }
    var diffSec = thisWeekSec - prevWeekSec;

    var totalSec = getCumulativeTotal();
    var totalH   = Math.floor(totalSec / 3600);
    var totalM   = Math.floor((totalSec % 3600) / 60);

    var weekLabel = _stWeekOff === 0 ? '本周' : (_stWeekOff === -1 ? '上周' : Math.abs(_stWeekOff) + '周前');
    var weekRange = fmtMD(dates[0]) + '–' + fmtMD(dates[6]);
    var isCurWeek = (_stWeekOff === 0);

    // ── Cumulative card ──────────────────────
    var html = '<div class="st-cumul">' +
        '<div class="st-cumul-label">累计收听总时长：</div>' +
        '<div class="st-cumul-value">' +
            '<div class="st-cumul-num">' + totalH + '</div><div class="st-cumul-unit">小时</div>' +
            '<div class="st-cumul-num" style="margin-left:8px;">' + totalM + '</div><div class="st-cumul-unit">分钟</div>' +
        '</div>' +
        '<div class="st-cumul-sub">每日 00:00 更新 · 仅统计音量≥40%的有效播放</div>' +
    '</div>';

    // ── Week chart card ──────────────────────
    html += '<div class="st-week-card">' +
        '<div class="st-week-nav">' +
            '<button class="st-week-arrow" onclick="stNavWeek(-1)" aria-label="查看上周">◀ 上周</button>' +
            '<div style="text-align:center;">' +
                '<div class="st-week-label">' + weekLabel + '</div>' +
                '<div class="st-week-range">' + weekRange + '</div>' +
            '</div>' +
            '<button class="st-week-arrow" onclick="stNavWeek(1)" ' + (isCurWeek ? 'disabled style="color:#ccc;"' : '') + '>下周 ▶</button>' +
        '</div>' +
        '<div class="st-bar-meta"><div class="st-bar-meta-l">本周收听时长</div><div class="st-bar-meta-r">单位：分钟</div></div>' +
        '<canvas id="stBarCanvas" height="210"></canvas>' +
        '<div class="st-week-totals">' +
            '<div class="st-week-total-cell">' +
                '<div class="st-week-total-label">' + weekLabel + '收听总时长</div>' +
                '<div class="st-week-total-value">' + fmtHM(thisWeekSec) + '</div>' +
            '</div>' +
            '<div class="st-week-total-cell">' +
                '<div class="st-week-total-label">同比' + (_stWeekOff === 0 ? '上周' : '前一周') + '时长</div>' +
                '<div class="st-week-compare ' +
                    (diffSec > 0 ? 'st-compare-up' : diffSec < 0 ? 'st-compare-down' : 'st-compare-same') + '">' +
                    (diffSec > 0 ? '↑ ' + fmtHM(diffSec) : diffSec < 0 ? '↓ ' + fmtHM(-diffSec) : '— 持平') +
                '</div>' +
            '</div>' +
        '</div>' +
    '</div>';

    // ── Files card ───────────────────────────
    var dayTracks = getDayTracks(_stSelDay);
    var dayLabel  = _stSelDay ? _stSelDay.replace(/-/g, '-') : '';
    html += '<div class="st-files-card">' +
        '<div class="st-files-header">' +
            '<div class="st-files-title">🎧 &nbsp;收听文件</div>' +
            '<div class="st-files-date">' + dayLabel + '</div>' +
        '</div>';
    if (dayTracks.length === 0) {
        html += '<div class="st-empty-files">该日暂无听力记录</div>';
    } else {
        for (var i = 0; i < dayTracks.length; i++) {
            var tr = dayTracks[i];
            var tm = Math.floor(tr.sec / 60);
            var ts = tr.sec % 60;
            var dur = '播放时长：' + (tm > 0 ? tm + '分钟' : '') + (ts > 0 ? ts + '秒' : '');
            html += '<div class="st-file-row">' +
                '<div class="st-file-icon">🎵</div>' +
                '<div class="st-file-info">' +
                    '<div class="st-file-name">' + escHtml(tr.name) + '</div>' +
                    '<div class="st-file-dur">' + dur + '</div>' +
                '</div>' +
            '</div>';
        }
    }
    html += '</div>';
    html += '<div class="st-notice">⚠️ 仅统计音量≥40%有效播放时间。iOS系统音量无法通过JS检测，已通过音频信号分析作补充判断。</div>';

    body.innerHTML = html;
    setTimeout(function() { drawBarChart(values, dates); }, 30);
}

function stNavWeek(dir) {
    var next = _stWeekOff + dir;
    if (next > 0) return;
    _stWeekOff = next;
    _stSelDay  = getWeekDates(_stWeekOff)[0];
    renderStats();
}

// AbortController for bar chart event listeners (avoids cloneNode hack)
var _chartAC = null;
var DAY_ZH = ['一','二','三','四','五','六','日'];

// Detect system dark mode for canvas rendering
function isDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function drawBarChart(values, dates) {
    var canvas = document.getElementById('stBarCanvas');
    if (!canvas) return;
    var dark = isDark();
    var colText     = dark ? '#ebebf5' : '#333';
    var colSubtext  = dark ? '#8e8e93' : '#999';
    var colGrid     = dark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.08)';
    var colCircleTxt= dark ? '#000'    : '#fff';
    var W   = canvas.parentNode.clientWidth - 32;
    var H   = 210;
    var dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    var PAD_T  = 26;
    var PAD_B  = 46;
    var PAD_LR = 4;
    var cH     = H - PAD_T - PAD_B;
    var colW   = (W - PAD_LR * 2) / 7;
    var barW   = Math.min(colW * 0.54, 30);

    var maxVal = 0;
    for (var i = 0; i < values.length; i++) if (values[i] > maxVal) maxVal = values[i];
    if (maxVal === 0) maxVal = 10;
    // Round maxVal up for cleaner grid
    var gridStep = maxVal <= 30 ? 10 : maxVal <= 120 ? 30 : maxVal <= 300 ? 60 : 120;
    maxVal = Math.ceil(maxVal / gridStep) * gridStep;

    // Grid
    var gridLines = 4;
    ctx.setLineDash([3, 3]);
    for (var gi = 0; gi <= gridLines; gi++) {
        var gy = PAD_T + cH - (cH * gi / gridLines);
        ctx.strokeStyle = colGrid; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(PAD_LR, gy); ctx.lineTo(W - PAD_LR, gy); ctx.stroke();
    }
    ctx.setLineDash([]);

    var selIdx = dates.indexOf(_stSelDay);

    for (var i = 0; i < 7; i++) {
        var cx  = PAD_LR + colW * i + colW / 2;
        var bh  = values[i] > 0 ? Math.max((values[i] / maxVal) * cH, barW) : 0;
        var bx  = cx - barW / 2;
        var by  = PAD_T + cH - bh;
        var sel = (i === selIdx);

        if (bh > 0) {
            var r = barW / 2;
            var gr = ctx.createLinearGradient(bx, by, bx, by + bh);
            if (sel) {
                gr.addColorStop(0, '#54b3ff');
                gr.addColorStop(1, '#007aff');
            } else {
                gr.addColorStop(0, '#a0d4ff');
                gr.addColorStop(1, '#5aadff');
            }
            ctx.fillStyle = gr;
            ctx.beginPath();
            if (bh >= barW * 1.1) {
                // Full pill (top+bottom rounded)
                ctx.arc(cx, by + r,      r, Math.PI, 0, false);
                ctx.lineTo(cx + r, by + bh - r);
                ctx.arc(cx, by + bh - r, r, 0, Math.PI, false);
                ctx.closePath();
            } else {
                ctx.arc(cx, by + bh/2, bh/2, 0, Math.PI*2);
            }
            ctx.fill();

            // Value label
            ctx.fillStyle   = sel ? '#007aff' : colText;
            ctx.font        = 'bold ' + (sel ? 13 : 11) + 'px -apple-system,sans-serif';
            ctx.textAlign   = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(String(values[i]), cx, by - 2);
        }

        // Day label
        ctx.fillStyle    = sel ? '#007aff' : colSubtext;
        ctx.font         = 'bold 12px -apple-system,sans-serif';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(DAY_ZH[i], cx, H - PAD_B + 14);

        // Selected indicator circle
        if (sel) {
            ctx.beginPath();
            ctx.arc(cx, H - 10, 9, 0, Math.PI * 2);
            ctx.fillStyle = '#007aff'; ctx.fill();
            ctx.fillStyle    = colCircleTxt;
            ctx.font         = 'bold 9px -apple-system,sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(DAY_ZH[i], cx, H - 10);
        }
    }

    // ── Tap/click: use AbortController to cleanly remove old listeners ──
    if (_chartAC) _chartAC.abort();
    // AbortController supported in all modern browsers; iOS 15+, Android 5+
    // For iOS 12 fallback: if not supported, use the flag-guard approach below
    var useAC = (typeof AbortController !== 'undefined');
    if (useAC) {
        _chartAC = new AbortController();
    } else {
        _chartAC = null;
    }

    function pickBar(clientX) {
        var r   = canvas.getBoundingClientRect();
        var x   = (clientX - r.left) / r.width * W;
        var idx = Math.floor((x - PAD_LR) / colW);
        if (idx < 0) idx = 0; if (idx > 6) idx = 6;
        _stSelDay = dates[idx];
        renderStats();
    }

    if (useAC) {
        canvas.addEventListener('click', function(e) { pickBar(e.clientX); },
            { signal: _chartAC.signal });
        canvas.addEventListener('touchend', function(e) {
            e.preventDefault(); pickBar(e.changedTouches[0].clientX);
        }, { signal: _chartAC.signal, passive: false });
    } else {
        // iOS 12 fallback: one-time cloneNode (safe because renderStats() replaces DOM anyway)
        var newC = canvas.cloneNode(false);
        var tmpCtx = newC.getContext('2d');
        tmpCtx.drawImage(canvas, 0, 0);
        canvas.parentNode.replaceChild(newC, canvas);
        newC.addEventListener('click', function(e) { pickBar(e.clientX); });
        newC.addEventListener('touchend', function(e) {
            e.preventDefault(); pickBar(e.changedTouches[0].clientX);
        }, false);
    }
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
