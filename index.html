<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>英语精听播放器 v1.7.2</title>
    <style>
        :root {
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-text: #000000;
            --ios-subtext: #8e8e93;
            --ios-blue: #007aff;
            --ios-red: #ff3b30;
            --ios-gray-btn: #eef0f4;
            --ios-blur: rgba(255,255,255,0.95);
            --ios-radius: 12px;
            --safe-top: env(safe-area-inset-top, 24px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background-color: var(--ios-bg); color: var(--ios-text);
            -webkit-user-select: none; user-select: none;
            display: -webkit-flex; display: flex;
            -webkit-flex-direction: column; flex-direction: column;
        }

        /* ── HEADER ─────────────────────────────── */
        .header {
            background-color: var(--ios-blur);
            -webkit-backdrop-filter: blur(25px); backdrop-filter: blur(25px);
            padding: calc(var(--safe-top) + 6px) 15px 8px 15px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            z-index: 100; -webkit-flex-shrink: 0; flex-shrink: 0;
        }
        .path-nav {
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: space-between; justify-content: space-between;
            margin-bottom: 8px;
        }
        .back-btn {
            color: var(--ios-blue); font-size: 17px; font-weight: 500;
            background: none; border: none; cursor: pointer;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-tap-highlight-color: transparent; padding: 4px 0;
        }
        .current-folder {
            font-size: 17px; font-weight: 700;
            max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .search-bar {
            background-color: rgba(118,118,128,0.12); border-radius: 10px;
            padding: 6px 12px;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
        }
        .search-input {
            border: none; background: transparent; width: 100%;
            font-size: 16px; margin-left: 6px; outline: none; -webkit-appearance: none;
        }

        /* ── CONTENT ─────────────────────────────── */
        .content {
            -webkit-flex: 1; flex: 1;
            overflow-y: scroll; -webkit-overflow-scrolling: touch;
            position: relative;
            padding: 10px 16px 295px 16px;
            -webkit-transition: padding-bottom 0.35s ease;
            transition: padding-bottom 0.35s ease;
        }
        body.player-compact .content { padding-bottom: 130px; }

        .list-group { background-color: var(--ios-card); border-radius: var(--ios-radius); overflow: hidden; }
        .list-item {
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            padding: 13px 16px; background-color: var(--ios-card);
            border-bottom: 0.5px solid rgba(0,0,0,0.08);
            cursor: pointer; position: relative;
            -webkit-tap-highlight-color: rgba(0,0,0,0.05); box-sizing: border-box;
        }
        .list-item:active { background-color: #e5e5ea; }
        .list-item.active .item-title { color: var(--ios-blue); font-weight: 600; }
        .list-item.pinned-item { background-color: rgba(0,122,255,0.05); }
        .list-item.dragging { opacity: 0.5; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .drag-handle { color: #ccc; margin-right: 12px; font-size: 20px; cursor: grab; padding: 5px; touch-action: none; }
        .item-icon { font-size: 20px; margin-right: 12px; width: 24px; text-align: center; }
        .item-info { -webkit-flex: 1; flex: 1; overflow: hidden; }
        .item-title { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #000; }
        .item-subtext { font-size: 11px; color: var(--ios-subtext); margin-top: 2px; }
        .item-fav-heart { padding: 10px; font-size: 20px; color: #ddd; }
        .item-fav-heart.fav-on { color: var(--ios-red); }

        /* ── PLAYER BAR ──────────────────────────── */
        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: var(--ios-card);
            border-top: 0.5px solid rgba(0,0,0,0.1);
            padding: 10px 0 calc(10px + var(--safe-bottom)) 0;
            z-index: 200; box-shadow: 0 -8px 30px rgba(0,0,0,0.08);
        }
        /* sections hidden when compact */
        .pf {
            overflow: hidden;
            max-height: 200px; opacity: 1;
            -webkit-transition: max-height 0.35s ease, opacity 0.3s ease;
            transition: max-height 0.35s ease, opacity 0.3s ease;
        }
        body.player-compact .pf { max-height: 0; opacity: 0; }

        /* Slider */
        .slider-container { padding: 0 20px; margin-bottom: 5px; }
        .slider-wrapper {
            position: relative; height: 20px;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
        }
        .slider-track-bg {
            position: absolute; left: 0; right: 0;
            height: 5px; background: #d1d1d6; border-radius: 3px; overflow: hidden;
        }
        .slider-track-fill {
            height: 100%; background: var(--ios-blue); border-radius: 3px; width: 0%;
            -webkit-transition: width 0.1s linear; transition: width 0.1s linear;
        }
        .ios-slider {
            -webkit-appearance: none; position: absolute;
            left: 0; right: 0; width: 100%; height: 20px;
            background: transparent; outline: none; cursor: pointer; margin: 0;
        }
        .ios-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px;
            background: white; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        /* Track display */
        .track-display { text-align: center; padding: 0 20px; margin-bottom: 5px; }
        .track-name {
            font-size: 16px; font-weight: 700;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: #000; margin-bottom: 1px;
        }
        .track-time { font-size: 11px; color: var(--ios-subtext); font-variant-numeric: tabular-nums; margin-bottom: 2px; }
        .audio-info { font-size: 10px; color: #b0b0b8; min-height: 13px; letter-spacing: 0.3px; }

        /* Learning controls */
        .learning-controls {
            display: -webkit-flex; display: flex;
            -webkit-justify-content: center; justify-content: center;
            -webkit-align-items: center; align-items: center;
            margin-bottom: 10px;
        }
        .learn-btn {
            background: none; border: none; color: #333; cursor: pointer;
            display: -webkit-flex; display: flex;
            -webkit-flex-direction: column; flex-direction: column;
            -webkit-align-items: center; align-items: center;
            font-size: 10px; font-weight: 600;
            margin: 0 22px; -webkit-tap-highlight-color: transparent; padding: 4px;
        }
        .learn-btn svg { width: 26px; height: 26px; margin-bottom: 2px; pointer-events: none; }
        .learn-btn.active { color: var(--ios-blue); }

        /* Basic controls */
        .basic-controls {
            display: -webkit-flex; display: flex;
            -webkit-justify-content: center; justify-content: center;
            -webkit-align-items: center; align-items: center;
            margin-bottom: 11px;
        }
        .basic-controls > * { margin: 0 10px; }
        .icon-btn {
            background: none; border: none; cursor: pointer; padding: 6px; color: #000;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .icon-btn svg { pointer-events: none; }
        .play-btn svg { width: 44px; height: 44px; }
        .side-btn svg { width: 28px; height: 28px; }
        .icon-btn.active { color: var(--ios-blue); }

        /* ── CYCLE BUTTON badge "1" ─────────────── */
        .cycle-wrap { position: relative; display: inline-block; padding: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; border: none; }
        .cycle-wrap svg { width: 28px; height: 28px; display: block; pointer-events: none; }
        .cycle-badge {
            position: absolute; top: 2px; right: 2px;
            width: 14px; height: 14px; border-radius: 7px;
            background: var(--ios-blue); color: #fff;
            font-size: 9px; font-weight: 800; line-height: 14px; text-align: center;
            display: none; pointer-events: none;
        }
        .cycle-wrap.mode-single { color: var(--ios-blue); }
        .cycle-wrap.mode-single .cycle-badge { display: block; }
        .cycle-wrap.mode-shuffle { color: var(--ios-blue); }

        /* Fav heart */
        .fav-btn {
            font-size: 26px; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            background: none; border: none; padding: 6px;
        }

        /* Feature grid */
        .feature-grid {
            display: -webkit-flex; display: flex;
            -webkit-justify-content: space-around; justify-content: space-around;
            -webkit-align-items: center; align-items: center;
            padding: 0 8px;
        }
        .pill-btn {
            background-color: var(--ios-gray-btn); border: none; border-radius: 8px;
            padding: 7px 0; font-size: 11px; font-weight: 600;
            display: -webkit-flex; display: flex;
            -webkit-flex-direction: column; flex-direction: column;
            -webkit-align-items: center; align-items: center;
            cursor: pointer; width: 18%; -webkit-tap-highlight-color: transparent;
        }
        .pill-btn span { line-height: 1.4; pointer-events: none; }
        .pill-btn.active { background-color: rgba(0,122,255,0.1); color: var(--ios-blue); }
        .version-tag { font-size: 10px; color: #c6c6c8; text-align: center; margin-top: 5px; }

        /* ── SPEED SHEET ─────────────────────────── */
        .sheet-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35); z-index: 500; display: none;
        }
        .speed-sheet {
            position: fixed; left: 0; right: 0; bottom: 0;
            background: var(--ios-card); border-radius: 20px 20px 0 0;
            z-index: 600; display: none;
            -webkit-flex-direction: column; flex-direction: column;
            padding-bottom: calc(16px + var(--safe-bottom));
            -webkit-animation: slideUp 0.3s ease-out; animation: slideUp 0.3s ease-out;
        }
        .speed-sheet.open { display: -webkit-flex; display: flex; }

        .speed-sheet-header {
            display: -webkit-flex; display: flex;
            -webkit-justify-content: space-between; justify-content: space-between;
            -webkit-align-items: center; align-items: center;
            padding: 14px 20px 4px 20px;
        }
        .speed-sheet-title { font-size: 17px; font-weight: 700; }
        .speed-done-btn {
            color: var(--ios-blue); font-size: 17px; font-weight: 600;
            background: none; border: none; cursor: pointer; padding: 4px;
            -webkit-tap-highlight-color: transparent;
        }
        /* live speed badge */
        .speed-live-badge {
            text-align: center; font-size: 28px; font-weight: 700;
            color: var(--ios-blue); padding: 4px 0 8px 0;
            letter-spacing: -0.5px;
        }
        /* Wheel */
        .speed-wheel-wrap { position: relative; height: 200px; overflow: hidden; }
        .speed-wheel-scroll {
            height: 100%; overflow-y: scroll;
            scroll-snap-type: y mandatory; -webkit-scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .speed-wheel-pad { height: 78px; }
        .speed-wheel-option {
            height: 44px;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: center; justify-content: center;
            scroll-snap-align: center;
            font-size: 20px; font-weight: 400; color: #000;
        }
        .speed-wheel-option.sel { font-weight: 700; color: var(--ios-blue); font-size: 22px; }
        .speed-wheel-mask {
            position: absolute; left: 0; right: 0; height: 78px; pointer-events: none; z-index: 2;
        }
        .speed-wheel-mask.top {
            top: 0;
            background: -webkit-linear-gradient(top, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 100%);
            background: linear-gradient(to bottom, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 100%);
        }
        .speed-wheel-mask.bottom {
            bottom: 0;
            background: -webkit-linear-gradient(bottom, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 100%);
            background: linear-gradient(to top, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 100%);
        }
        .speed-wheel-selector {
            position: absolute; top: 78px; left: 20px; right: 20px; height: 44px;
            border-top: 1px solid rgba(0,0,0,0.15);
            border-bottom: 1px solid rgba(0,0,0,0.15);
            pointer-events: none; z-index: 3; border-radius: 4px;
        }

        /* ── PLAYLIST MODAL ──────────────────────── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); z-index: 1000; display: none;
            -webkit-align-items: flex-end; align-items: flex-end;
            -webkit-justify-content: center; justify-content: center;
        }
        .playlist-modal {
            background: var(--ios-card); width: 100%; max-width: 500px;
            border-radius: 24px 24px 0 0;
            padding: 20px 0 calc(20px + var(--safe-bottom)) 0;
            -webkit-animation: slideUp 0.3s ease-out; animation: slideUp 0.3s ease-out;
        }
        @-webkit-keyframes slideUp { from { -webkit-transform: translateY(100%); } to { -webkit-transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        #toast {
            position: fixed; top: 25%; left: 50%;
            -webkit-transform: translateX(-50%); transform: translateX(-50%);
            background: rgba(0,0,0,0.82); color: white;
            padding: 11px 22px; border-radius: 22px; font-size: 15px;
            z-index: 2000; display: none; white-space: nowrap;
        }
        #noSleepVideo { display: none; width: 1px; height: 1px; }

        /* ── STATS SHEET ─────────────────────────── */
        .stats-sheet-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45); z-index: 800; display: none;
        }
        .stats-sheet {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--ios-bg); z-index: 900; display: none;
            -webkit-flex-direction: column; flex-direction: column;
            -webkit-animation: slideUp 0.35s ease-out; animation: slideUp 0.35s ease-out;
        }
        .stats-sheet.open { display: -webkit-flex; display: flex; }

        /* stats header */
        .stats-header {
            background: var(--ios-blur);
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            padding: calc(var(--safe-top) + 6px) 16px 0 16px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            -webkit-flex-shrink: 0; flex-shrink: 0;
        }
        .stats-header-row {
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: space-between; justify-content: space-between;
            margin-bottom: 12px;
        }
        .stats-title { font-size: 20px; font-weight: 700; }
        .stats-close-btn {
            background: #e5e5ea; border: none; border-radius: 50%;
            width: 30px; height: 30px; font-size: 16px; cursor: pointer;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: center; justify-content: center;
            -webkit-tap-highlight-color: transparent; color: #555; font-weight: 700;
        }
        /* tab bar */
        .stats-tabs {
            display: -webkit-flex; display: flex;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
        }
        .stats-tab {
            -webkit-flex: 1; flex: 1; text-align: center;
            padding: 10px 0; font-size: 14px; font-weight: 600;
            color: var(--ios-subtext); cursor: pointer;
            border-bottom: 2px solid transparent;
            -webkit-tap-highlight-color: transparent;
            background: none; border-top: none; border-left: none; border-right: none;
        }
        .stats-tab.active { color: var(--ios-blue); border-bottom: 2px solid var(--ios-blue); }

        /* stats body */
        .stats-body {
            -webkit-flex: 1; flex: 1;
            overflow-y: scroll; -webkit-overflow-scrolling: touch;
            padding: 16px 16px 30px 16px;
        }

        /* summary card */
        .stats-summary-card {
            background: var(--ios-blue);
            border-radius: 16px; padding: 18px 20px; margin-bottom: 16px;
            display: -webkit-flex; display: flex;
            -webkit-justify-content: space-between; justify-content: space-between;
            -webkit-align-items: center; align-items: center;
        }
        .stats-summary-label { font-size: 13px; color: rgba(255,255,255,0.75); margin-bottom: 4px; }
        .stats-summary-value { font-size: 32px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
        .stats-summary-unit  { font-size: 14px; color: rgba(255,255,255,0.8); margin-left: 4px; }
        .stats-summary-sub   { font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 3px; }

        /* notice when no data */
        .stats-empty {
            text-align: center; padding: 50px 20px;
            color: var(--ios-subtext); font-size: 15px; line-height: 1.6;
        }
        .stats-empty-icon { font-size: 44px; margin-bottom: 12px; }

        /* today table */
        .stats-section-title {
            font-size: 13px; font-weight: 700; color: var(--ios-subtext);
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 8px; margin-top: 16px;
        }
        .stats-table {
            background: var(--ios-card); border-radius: 12px; overflow: hidden;
        }
        .stats-row {
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            padding: 12px 16px;
            border-bottom: 0.5px solid rgba(0,0,0,0.07);
        }
        .stats-row:last-child { border-bottom: none; }
        .stats-row-rank {
            width: 22px; height: 22px; border-radius: 11px;
            background: var(--ios-blue); color: #fff;
            font-size: 11px; font-weight: 700; text-align: center; line-height: 22px;
            margin-right: 12px; -webkit-flex-shrink: 0; flex-shrink: 0;
        }
        .stats-row-rank.gold   { background: #f5a623; }
        .stats-row-rank.silver { background: #9b9b9b; }
        .stats-row-rank.bronze { background: #c47c3d; }
        .stats-row-name {
            -webkit-flex: 1; flex: 1;
            font-size: 14px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; color: #000;
        }
        .stats-row-time {
            font-size: 13px; font-weight: 600; color: var(--ios-blue);
            margin-left: 10px; -webkit-flex-shrink: 0; flex-shrink: 0;
        }
        .stats-row-bar-wrap {
            width: 100%; height: 4px; background: #f0f0f5;
            border-radius: 2px; margin-top: 5px;
        }
        .stats-row-bar-fill {
            height: 100%; background: var(--ios-blue);
            border-radius: 2px; -webkit-transition: width 0.5s ease; transition: width 0.5s ease;
        }

        /* chart */
        .stats-chart-wrap {
            background: var(--ios-card); border-radius: 16px;
            padding: 16px 8px 8px 8px; margin-bottom: 16px; position: relative;
        }
        .stats-chart-title {
            font-size: 13px; font-weight: 700; color: var(--ios-subtext);
            text-align: center; margin-bottom: 12px;
        }
        #statsCanvas { display: block; width: 100%; touch-action: none; }
        .stats-chart-tooltip {
            position: absolute; background: rgba(0,0,0,0.82); color: #fff;
            font-size: 12px; font-weight: 600; padding: 5px 10px;
            border-radius: 8px; pointer-events: none; display: none;
            white-space: nowrap; z-index: 10;
            -webkit-transform: translate(-50%, -130%); transform: translate(-50%, -130%);
        }
        .stats-notice {
            font-size: 11px; color: #b0b0b8; text-align: center;
            margin-top: 8px; padding: 0 8px;
        }
    </style>
</head>

<!-- Collect Modal -->
<div class="modal-overlay" id="playlistModal" onclick="if(event.target===this)closePlaylistModal()">
    <div class="playlist-modal">
        <div style="font-size:18px;font-weight:700;text-align:center;margin-bottom:15px;">添加到收藏夹</div>
        <div id="playlistOptions" style="overflow-y:auto;max-height:45vh;"></div>

<!-- Stats Sheet -->
<div class="stats-sheet-overlay" id="statsOverlay" onclick="closeStats()"></div>
<div class="stats-sheet" id="statsSheet">

                <span>📂</span><span>收藏</span>

<script>
// ════════════════ CONFIG ════════════════
var SITE_ROOT    = 'https://res.evanyin.dpdns.org/';
var AUDIO_EXTS   = ['.mp3','.wav','.flac','.m4a','.aac','.ogg','.opus'];
// Speed options 0.5 → 3.0, step ~0.1-0.25
var SPEED_OPTIONS = [
    0.5, 0.6, 0.7, 0.8, 0.9,
    1.0, 1.1, 1.2, 1.25, 1.3, 1.4, 1.5,
    1.6, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0
];
var WHEEL_ITEM_H = 44;   // px – must match .speed-wheel-option height

// ════════════════ STATE ═════════════════
var currentPath        = SITE_ROOT;
var fileList           = [];
var playList           = [];
var currentTrackIndex  = -1;
// playMode: 'list' | 'single' | 'shuffle'
var playMode           = 'list';
var shuffleOrder       = [];
var playbackRate       = 1.0;
var sleepTimer         = null;
var abA                = null, abB = null;
var isDraggingSlider   = false;
var isWakeLockEnabled  = false;
var wakeLockObj        = null;
var _speedScrollTimer  = null;
var _fileSizeCache     = {};   // url → bytes

var playlists   = {};
var progressDB  = {};
try { playlists  = JSON.parse(localStorage.getItem('my_playlists_v3') || '{}'); } catch(e) {}
try { progressDB = JSON.parse(localStorage.getItem('audio_progress_v2') || '{}'); } catch(e) {}

var audio     = document.getElementById('audioPlayer');
var slider    = document.getElementById('progressSlider');
var fillEl    = document.getElementById('sliderFill');
var noSleepV  = document.getElementById('noSleepVideo');

// ════════════════ INIT ══════════════════
function init() {
    fetchDirectory(currentPath);
    setupAudioEvents();
    setupSlider();
    buildSpeedWheel();
    setCompact(true);
    startStatsTicker();
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else { init(); }

// ════════════════ COMPACT / EXPANDED ═══
function setCompact(c) {
    document.body.className = c ? 'player-compact' : '';
}

// ════════════════ SLIDER ════════════════
function setupSlider() {
    slider.addEventListener('touchstart', function() { isDraggingSlider = true; }, false);
    slider.addEventListener('mousedown',  function() { isDraggingSlider = true; });
    slider.addEventListener('input', function() {
        isDraggingSlider = true;
        setFill(slider.value);
        if (audio.duration) {
            var t = (slider.value / 100) * audio.duration;
            document.getElementById('trackTime').textContent = fmtTime(t) + ' / ' + fmtTime(audio.duration);
        }
    });
    function commitSeek() {
        if (audio.duration) { audio.currentTime = (slider.value / 100) * audio.duration; saveProgress(); }
        isDraggingSlider = false;
    }
    slider.addEventListener('change',   commitSeek);
    slider.addEventListener('touchend', commitSeek, false);
}
function setFill(pct) { fillEl.style.width = pct + '%'; }

// ════════════════ AUDIO EVENTS ══════════
function setupAudioEvents() {
    audio.addEventListener('play',   function() {
        document.getElementById('iconPlay').style.display  = 'none';
        document.getElementById('iconPause').style.display = 'block';
        setCompact(false);
    });
    audio.addEventListener('pause',  function() {
        document.getElementById('iconPlay').style.display  = 'block';
        document.getElementById('iconPause').style.display = 'none';
        saveProgress();
    });
    audio.addEventListener('ended',  function() {
        try { delete progressDB[audio.src]; localStorage.setItem('audio_progress_v2', JSON.stringify(progressDB)); } catch(e) {}
        if (playMode === 'single') { playTrack(currentTrackIndex); }
        else { playNext(); }
    });
    audio.addEventListener('timeupdate', onTU);
    audio.addEventListener('durationchange', function() {
        if (audio.duration && !isNaN(audio.duration)) {
            document.getElementById('trackTime').textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
            updateAudioInfo();
        }
    });

    // Polyfill interval: keeps time display alive on iOS 12 where timeupdate misfires
    setInterval(function() {
        if (!audio.paused && !isDraggingSlider && audio.duration && !isNaN(audio.duration)) {
            var pct = (audio.currentTime / audio.duration) * 100;
            slider.value = pct;
            setFill(pct);
            document.getElementById('trackTime').textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
        }
    }, 200);
}

function onTU() {
    if (!audio.duration || isNaN(audio.duration)) return;
    if (!isDraggingSlider) {
        var pct = (audio.currentTime / audio.duration) * 100;
        slider.value = pct;
        setFill(pct);
        document.getElementById('trackTime').textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
    }
    if (abA !== null && abB !== null && audio.currentTime >= abB) audio.currentTime = abA;
}

// ════════════════ PLAY CONTROLS ═════════
function togglePlay() {
    if (!audio.src || audio.src === window.location.href) {
        if (playList.length > 0) playTrack(0);
        return;
    }
    if (audio.paused) { audio.play().catch(function(e) {}); }
    else { audio.pause(); }
}

function playTrack(index) {
    if (index < 0 || index >= playList.length) return;
    currentTrackIndex = index;
    var track = playList[index];

    audio.src = track.url;
    audio.playbackRate = playbackRate;
    document.getElementById('trackName').textContent = track.name;
    document.getElementById('trackTime').textContent = '--:-- / --:--';
    document.getElementById('audioInfo').textContent = '';

    resetAB();
    updateFavHeart();
    renderListHighlight();
    startAudioInfoLoad(track.url);

    var savedTime = progressDB[track.url] || 0;
    var metaHandler = function() {
        audio.removeEventListener('loadedmetadata', metaHandler);
        if (savedTime > 2 && audio.duration && !isNaN(audio.duration)) {
            audio.currentTime = savedTime;
            showToast('恢复进度: ' + fmtTime(savedTime));
        }
        updateAudioInfo();
    };
    audio.addEventListener('loadedmetadata', metaHandler);
    audio.load();
    audio.play().catch(function() {});
}

function playNext() {
    if (!playList.length) return;
    if (playMode === 'shuffle') {
        var pos = shuffleOrder.indexOf(currentTrackIndex);
        playTrack(shuffleOrder[(pos + 1) % shuffleOrder.length]);
    } else {
        playTrack((currentTrackIndex + 1) % playList.length);
    }
}
function playPrev() {
    if (!playList.length) return;
    if (playMode === 'shuffle') {
        var pos = shuffleOrder.indexOf(currentTrackIndex);
        playTrack(shuffleOrder[(pos - 1 + shuffleOrder.length) % shuffleOrder.length]);
    } else {
        playTrack((currentTrackIndex - 1 + playList.length) % playList.length);
    }
}
function seekRelative(sec) {
    if (!audio.duration) return;
    audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec));
    saveProgress();
}

// ════════════════ CYCLE PLAY MODE ═══════
// Cycles: list → single → shuffle → list  (like Apple Music)
function cyclPlayMode() {
    if (playMode === 'list')   { playMode = 'single'; }
    else if (playMode === 'single') { playMode = 'shuffle'; if (!shuffleOrder.length) genShuffle(); }
    else                       { playMode = 'list'; }
    updateCycleBtn();
    var labels = { list:'列表循环', single:'单曲循环', shuffle:'随机播放' };
    showToast(labels[playMode]);
}

function updateCycleBtn() {
    var btn    = document.getElementById('cycleBtn');
    var iList  = document.getElementById('cycleIconList');
    var iSingle= document.getElementById('cycleIconSingle');
    var iShuf  = document.getElementById('cycleIconShuffle');
    var badge  = document.getElementById('cycleBadge');
    // reset
    btn.className    = 'cycle-wrap';
    iList.style.display   = 'none';
    iSingle.style.display = 'none';
    iShuf.style.display   = 'none';
    badge.style.display   = 'none';

    if (playMode === 'list') {
        iList.style.display = 'block';
    } else if (playMode === 'single') {
        btn.className = 'cycle-wrap mode-single';
        iSingle.style.display = 'block';
        badge.style.display   = 'block';
    } else { // shuffle
        btn.className = 'cycle-wrap mode-shuffle';
        iShuf.style.display = 'block';
    }
}

function genShuffle() {
    shuffleOrder = [];
    for (var i = 0; i < playList.length; i++) shuffleOrder.push(i);
    for (var i = shuffleOrder.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = shuffleOrder[i]; shuffleOrder[i] = shuffleOrder[j]; shuffleOrder[j] = tmp;
    }
    // put current track first
    var cur = shuffleOrder.indexOf(currentTrackIndex);
    if (cur > 0) { var t = shuffleOrder[0]; shuffleOrder[0] = shuffleOrder[cur]; shuffleOrder[cur] = t; }
}

// ════════════════ AUDIO INFO ════════════
// Fetches file size via HEAD (or Range request) and pairs with duration to estimate bitrate
function startAudioInfoLoad(url) {
    var ext = url.split('.').pop().toUpperCase();
    document.getElementById('audioInfo').textContent = ext + ' · 读取中…';

    // Try HEAD first, fall back to Range 0-0
    var fetched = false;
    function tryHead() {
        var xhr = new XMLHttpRequest();
        xhr.open('HEAD', url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4) return;
            var size = parseInt(xhr.getResponseHeader('Content-Length') || '0', 10);
            if (size > 0) {
                _fileSizeCache[url] = size;
                fetched = true;
                updateAudioInfo();
            } else if (!fetched) {
                tryRange();
            }
        };
        xhr.onerror = function() { if (!fetched) tryRange(); };
        try { xhr.send(); } catch(e) { if (!fetched) tryRange(); }
    }
    function tryRange() {
        var xhr2 = new XMLHttpRequest();
        xhr2.open('GET', url, true);
        try { xhr2.setRequestHeader('Range', 'bytes=0-0'); } catch(e) {}
        xhr2.onreadystatechange = function() {
            if (xhr2.readyState !== 4) return;
            // Content-Range: bytes 0-0/TOTAL
            var cr = xhr2.getResponseHeader('Content-Range') || '';
            var m  = cr.match(/\/(\d+)/);
            if (m) {
                _fileSizeCache[url] = parseInt(m[1], 10);
                fetched = true;
                updateAudioInfo();
            } else {
                // Can't get size – just show format
                document.getElementById('audioInfo').textContent = ext;
            }
        };
        xhr2.onerror = function() { document.getElementById('audioInfo').textContent = ext; };
        try { xhr2.send(); } catch(e) { document.getElementById('audioInfo').textContent = ext; }
    }
    tryHead();
}

function updateAudioInfo() {
    var url = audio.src;
    if (!url) return;
    var ext  = url.split('.').pop().toUpperCase();
    var dur  = audio.duration;
    var size = _fileSizeCache[url] || 0;

    var parts = [ext];
    if (size > 0 && dur && !isNaN(dur) && dur > 0) {
        var kbps = Math.round((size * 8) / dur / 1000);
        parts.push('~' + kbps + ' kbps');
        parts.push(fmtSize(size));
    } else if (size > 0) {
        parts.push(fmtSize(size));
    }
    document.getElementById('audioInfo').textContent = parts.join(' · ');
}

function fmtSize(b) {
    if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
    if (b >= 1024)    return Math.round(b / 1024) + ' KB';
    return b + ' B';
}

// ════════════════ SPEED WHEEL ═══════════
function buildSpeedWheel() {
    var wheel = document.getElementById('speedWheelScroll');
    wheel.innerHTML = '';
    var pad1 = document.createElement('div'); pad1.className = 'speed-wheel-pad'; wheel.appendChild(pad1);
    for (var i = 0; i < SPEED_OPTIONS.length; i++) {
        var opt = document.createElement('div');
        opt.className = 'speed-wheel-option';
        opt.textContent = fmtSpeed(SPEED_OPTIONS[i]);
        wheel.appendChild(opt);
    }
    var pad2 = document.createElement('div'); pad2.className = 'speed-wheel-pad'; wheel.appendChild(pad2);

    // Real-time speed change on scroll – debounced 80ms for smoothness
    wheel.addEventListener('scroll', function() {
        clearTimeout(_speedScrollTimer);
        _speedScrollTimer = setTimeout(applyWheelSpeed, 80);
        // also call immediately for live feel
        applyWheelSpeed();
    }, false);
}

function fmtSpeed(s) {
    return (s % 1 === 0 ? s.toFixed(1) : String(s)) + 'x';
}

function applyWheelSpeed() {
    var wheel = document.getElementById('speedWheelScroll');
    var idx = Math.round(wheel.scrollTop / WHEEL_ITEM_H);
    idx = Math.max(0, Math.min(idx, SPEED_OPTIONS.length - 1));
    var newSpeed = SPEED_OPTIONS[idx];
    document.getElementById('speedLiveBadge').textContent = fmtSpeed(newSpeed);
    // Highlight selected item
    var opts = wheel.querySelectorAll('.speed-wheel-option');
    for (var i = 0; i < opts.length; i++) {
        opts[i].className = 'speed-wheel-option' + (i === idx ? ' sel' : '');
    }
    // Apply in real-time
    if (newSpeed !== playbackRate) {
        playbackRate = newSpeed;
        audio.playbackRate = playbackRate;
        document.getElementById('speedLabel').textContent = fmtSpeed(playbackRate);
        var sBtn = document.getElementById('speedBtn');
        if (sBtn) sBtn.className = 'pill-btn' + (playbackRate !== 1.0 ? ' active' : '');
    }
}

function openSpeedSheet() {
    var wheel = document.getElementById('speedWheelScroll');
    var idx   = SPEED_OPTIONS.indexOf(playbackRate);
    if (idx < 0) idx = SPEED_OPTIONS.indexOf(1.0);
    wheel.scrollTop = idx * WHEEL_ITEM_H;
    document.getElementById('speedLiveBadge').textContent = fmtSpeed(SPEED_OPTIONS[idx]);
    applyWheelSpeed();

    document.getElementById('speedOverlay').style.display = 'block';
    document.getElementById('speedSheet').className = 'speed-sheet open';
}

function closeSpeedSheet() {
    document.getElementById('speedOverlay').style.display = 'none';
    document.getElementById('speedSheet').className = 'speed-sheet';
}

// ════════════════ WAKE LOCK ══════════════
function toggleWakeLock() {
    isWakeLockEnabled = !isWakeLockEnabled;
    var btn   = document.getElementById('wakeLockBtn');
    var label = document.getElementById('wakeLockLabel');
    if (isWakeLockEnabled) {
        btn.className   = 'pill-btn active';
        label.textContent = '常亮开';
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').then(function(wl) {
                wakeLockObj = wl;
                wl.addEventListener('release', function() {
                    if (isWakeLockEnabled && document.visibilityState === 'visible') {
                        navigator.wakeLock.request('screen').then(function(w2) { wakeLockObj = w2; }).catch(function(){});
                    }
                });
            }).catch(function(){});
        }
        noSleepV.play().catch(function(){});
        showToast('已开启屏幕常亮');
    } else {
        btn.className   = 'pill-btn';
        label.textContent = '常亮关';
        if (wakeLockObj) { try { wakeLockObj.release(); } catch(e){} wakeLockObj = null; }
        noSleepV.pause();
        showToast('已关闭屏幕常亮');
    }
}
document.addEventListener('visibilitychange', function() {
    if (isWakeLockEnabled && document.visibilityState === 'visible' && 'wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(function(wl) { wakeLockObj = wl; }).catch(function(){});
    }
});

// ════════════════ A-B REPEAT ═════════════
function handleABRepeat() {
    var btn = document.getElementById('abBtn');
    var txt = document.getElementById('abText');
    if (abA === null) {
        abA = audio.currentTime;
        btn.className = 'learn-btn active';
        txt.textContent = '设B点';
    } else if (abB === null) {
        abB = audio.currentTime;
        if (abB <= abA) { abB = null; showToast('B点须在A点之后'); return; }
        txt.textContent = '循环中';
        audio.currentTime = abA;
    } else {
        abA = null; abB = null;
        btn.className = 'learn-btn';
        txt.textContent = 'A-B重复';
    }
}
function resetAB() {
    abA = null; abB = null;
    var btn = document.getElementById('abBtn');
    var txt = document.getElementById('abText');
    if (btn) btn.className = 'learn-btn';
    if (txt) txt.textContent = 'A-B重复';
}

// ════════════════ TIMER ══════════════════
function setTimer() {
    var i = prompt('定时停止（分钟）:', '30');
    if (i && !isNaN(i) && parseFloat(i) > 0) {
        if (sleepTimer) clearTimeout(sleepTimer);
        document.getElementById('timerBtn').className = 'pill-btn active';
        sleepTimer = setTimeout(function() {
            audio.pause();
            document.getElementById('timerBtn').className = 'pill-btn';
            sleepTimer = null;
            showToast('定时停止');
        }, parseFloat(i) * 60000);
        showToast('定时 ' + i + ' 分钟后停止');
    }
}

// ════════════════ FAVOURITES ═════════════
function openPlaylistModal() {
    var track = playList[currentTrackIndex];
    if (!track) { showToast('请先播放歌曲'); return; }
    var overlay = document.getElementById('playlistModal');
    overlay.style.display = '-webkit-flex';
    overlay.style.display = 'flex';
    var container = document.getElementById('playlistOptions');
    container.innerHTML = '';
    var keys = Object.keys(playlists);
    for (var k = 0; k < keys.length; k++) {
        (function(name) {
            var opt = document.createElement('div');
            opt.style.cssText = 'padding:16px 25px;border-bottom:0.5px solid #eee;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;font-size:17px;cursor:pointer;';
            var isIn = playlists[name].some(function(f) { return f.url === track.url; });
            opt.innerHTML = '<span style="margin-right:12px;">📁</span><span style="-webkit-flex:1;flex:1;">' + name + '</span>' + (isIn ? '<span style="color:var(--ios-blue);">✓</span>' : '');
            opt.onclick = function() { addToPlaylist(name); };
            container.appendChild(opt);
        })(keys[k]);
    }
}
function closePlaylistModal() { document.getElementById('playlistModal').style.display = 'none'; }

function addToPlaylist(name) {
    var track = playList[currentTrackIndex]; if (!track) return;
    var list = playlists[name];
    var idx  = -1;
    for (var i = 0; i < list.length; i++) { if (list[i].url === track.url) { idx = i; break; } }
    if (idx > -1) { list.splice(idx, 1); showToast('从【' + name + '】移除'); }
    else           { list.push(track);   showToast('已加入【' + name + '】'); }
    savePlaylists(); updateFavHeart(); closePlaylistModal();
    if (currentPath === 'virtual:list:' + name) renderTracksInPlaylist(name);
}

function createNewPlaylistFromModal() {
    var name = prompt('新收藏夹名称:');
    if (name && name.trim()) {
        var c = name.trim();
        if (!playlists[c]) playlists[c] = [];
        addToPlaylist(c);
    }
}

function updateFavHeart() {
    var track = playList[currentTrackIndex];
    var btn   = document.getElementById('mainFavBtn');
    if (!btn) return;
    if (!track) { btn.textContent = '🤍'; return; }
    var keys  = Object.keys(playlists);
    var isIn  = keys.some(function(k) { return playlists[k].some(function(f) { return f.url === track.url; }); });
    btn.textContent = isIn ? '❤️' : '🤍';
}

function toggleQuickFav(e, encoded) {
    e.stopPropagation();
    var track; try { track = JSON.parse(decodeURIComponent(encoded)); } catch(e2) { return; }
    var targets = Object.keys(playlists).filter(function(n) {
        return playlists[n].some(function(f) { return f.url === track.url; });
    });
    if (targets.length > 0) {
        for (var i = 0; i < targets.length; i++) {
            playlists[targets[i]] = playlists[targets[i]].filter(function(f) { return f.url !== track.url; });
        }
        showToast('已取消收藏');
        savePlaylists(); updateFavHeart(); filterList();
    } else {
        var idx = -1;
        for (var i = 0; i < playList.length; i++) { if (playList[i].url === track.url) { idx = i; break; } }
        if (idx > -1) currentTrackIndex = idx;
        openPlaylistModal();
    }
}
function savePlaylists() { try { localStorage.setItem('my_playlists_v3', JSON.stringify(playlists)); } catch(e) {} }

function saveProgress() {
    if (audio.src && audio.currentTime > 0) {
        try { progressDB[audio.src] = audio.currentTime; localStorage.setItem('audio_progress_v2', JSON.stringify(progressDB)); } catch(e) {}
    }
}

// ════════════════ DIRECTORY ═════════════
function fetchDirectory(url) {
    if (url === 'virtual:folders') { renderPlaylistFolders(); return; }
    if (url.indexOf('virtual:list:') === 0) { renderTracksInPlaylist(url.replace('virtual:list:', '')); return; }
    currentPath = url;
    document.getElementById('fileList').innerHTML = '<div style="text-align:center;padding:20px;color:gray;">连接中...</div>';
    var disp = url.replace(SITE_ROOT, '/'); if (!disp) disp = '/';
    document.getElementById('currentFolder').textContent = disp;

    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
            parseDirectory(xhr.responseText, url);
        } else {
            document.getElementById('fileList').innerHTML = '<div style="padding:20px;color:red;text-align:center;">无法连接服务器 (' + xhr.status + ')</div>';
        }
    };
    xhr.onerror = function() {
        document.getElementById('fileList').innerHTML = '<div style="padding:20px;color:red;text-align:center;">无法连接服务器</div>';
    };
    xhr.send();
}

function parseDirectory(htmlText, baseUrl) {
    var parser = new DOMParser();
    var doc    = parser.parseFromString(htmlText, 'text/html');
    var links  = doc.querySelectorAll('a');
    fileList = []; playList = [];
    for (var i = 0; i < links.length; i++) {
        var a    = links[i];
        var href = a.getAttribute('href');
        var text = a.textContent.trim();
        if (!href || href === '../' || href === './' || text.indexOf('Parent Directory') > -1) continue;
        var fullUrl;
        try { fullUrl = new URL(href, baseUrl).href; } catch(e2) { continue; }
        var name     = decodeURIComponent(text.replace(/[📁📄]/g,'').replace(/\/$/,'').trim());
        var isFolder = href.charAt(href.length - 1) === '/';
        var nLow     = name.toLowerCase();
        var isAudio  = AUDIO_EXTS.some(function(ext) { return nLow.slice(-ext.length) === ext; });
        if (isFolder || isAudio) {
            var item = { name: name, url: fullUrl, isFolder: isFolder, isAudio: isAudio };
            fileList.push(item);
            if (isAudio) playList.push(item);
        }
    }
    if (playMode === 'shuffle') genShuffle();
    renderList(fileList, false);
}

function renderList(items, isPlaylist) {
    var container = document.getElementById('fileList');
    container.innerHTML = '';

    // Pinned shortcuts
    if (currentPath !== 'virtual:folders' && currentPath.indexOf('virtual:list:') !== 0) {
        appendPinnedItem(container, '⭐️', '我的收藏夹', '', function() { fetchDirectory('virtual:folders'); });
        if (playList.length > 1) {
            var sLabel = playMode === 'shuffle' ? '关闭随机 · 改为列表循环' : '随机播放此目录';
            appendPinnedItem(container, '🔀', sLabel, playList.length + ' 首', function() {
                if (playMode !== 'shuffle') {
                    playMode = 'shuffle';
                    genShuffle();
                    updateCycleBtn();
                    playTrack(shuffleOrder[0]);
                    showToast('随机播放');
                } else {
                    playMode = 'list';
                    updateCycleBtn();
                    showToast('列表循环');
                }
                renderList(items, isPlaylist);
            });
        }
    }

    if (!isPlaylist) {
        items.sort(function(a, b) {
            if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
            return a.name.localeCompare(b.name);
        });
    }

    for (var i = 0; i < items.length; i++) {
        (function(item) {
            var div = document.createElement('div');
            div.className = 'list-item';
            if (currentTrackIndex >= 0 && playList[currentTrackIndex] && playList[currentTrackIndex].url === item.url)
                div.className += ' active';

            var keys  = Object.keys(playlists);
            var isFav = keys.some(function(k) { return playlists[k].some(function(f) { return f.url === item.url; }); });
            var prog  = progressDB[item.url];
            var sub   = (prog && prog > 2) ? '<div class="item-subtext">上次 ' + fmtTime(prog) + '</div>' : '';
            var enc   = encodeURIComponent(JSON.stringify(item));

            div.innerHTML =
                (isPlaylist ? '<div class="drag-handle">≡</div>' : '') +
                '<div class="item-icon">' + (item.isFolder ? '📁' : '🎵') + '</div>' +
                '<div class="item-info"><div class="item-title">' + item.name + '</div>' + sub + '</div>' +
                (item.isAudio ? '<div class="item-fav-heart ' + (isFav ? 'fav-on' : '') + '" onclick="toggleQuickFav(event,\'' + enc + '\')">' + (isFav ? '❤️' : '🤍') + '</div>' : '');

            div.onclick = function(e) {
                var node = e.target || e.srcElement;
                while (node && node !== div) {
                    var cn = node.className || '';
                    if (cn.indexOf('item-fav-heart') > -1 || cn.indexOf('drag-handle') > -1) return;
                    node = node.parentNode;
                }
                if (item.isFolder) {
                    fetchDirectory(item.url);
                } else {
                    var idx = -1;
                    for (var j = 0; j < playList.length; j++) { if (playList[j].url === item.url) { idx = j; break; } }
                    playTrack(idx);
                }
            };
            if (isPlaylist) setupDragSort(div);
            container.appendChild(div);
        })(items[i]);
    }
}

function appendPinnedItem(container, icon, title, sub, onclick) {
    var div = document.createElement('div');
    div.className = 'list-item pinned-item';
    div.innerHTML = '<div class="item-icon">' + icon + '</div><div class="item-info"><div class="item-title">' + title + '</div>' + (sub ? '<div class="item-subtext">' + sub + '</div>' : '') + '</div>';

                playMode = 'shuffle'; genShuffle(); updateCycleBtn();

// ════════════════ NAVIGATION ═════════════
function goBack() {
    if (currentPath.indexOf('virtual:list:') === 0) { fetchDirectory('virtual:folders'); return; }
    if (currentPath === 'virtual:folders') { fetchDirectory(SITE_ROOT); return; }
    try {
        var u = new URL(currentPath);
        var parts = u.pathname.split('/').filter(function(x) { return x; });
        parts.pop();
        fetchDirectory(u.origin + '/' + parts.join('/') + (parts.length ? '/' : ''));
    } catch(e) { fetchDirectory(SITE_ROOT); }
}
function filterList() {
    if (currentPath === 'virtual:folders') { renderPlaylistFolders(); return; }
    if (currentPath.indexOf('virtual:list:') === 0) { renderTracksInPlaylist(currentPath.replace('virtual:list:', '')); return; }

    renderList(fileList.filter(function(i) { return i.name.toLowerCase().indexOf(term) > -1; }), false);
}
function refreshList() { fetchDirectory(currentPath); }

// ════════════════ DRAG & DROP ════════════
var dragSrcEl = null;
function handleDragStart(e, el) {
    dragSrcEl = el;
    el.className += ' dragging';
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('touchmove', handleDragMove, false);
    window.addEventListener('mouseup',   handleDragEnd);
    window.addEventListener('touchend',  handleDragEnd, false);
}
function handleDragMove(e) {
    if (!dragSrcEl) return;
    e.preventDefault();
    var touch  = e.type === 'touchmove' ? e.touches[0] : e;
    var target = document.elementFromPoint(touch.clientX, touch.clientY);
    var overEl = null;
    while (target) {
        if (target.className && target.className.indexOf('list-item') > -1) { overEl = target; break; }
        target = target.parentNode;
    }
    if (overEl && overEl !== dragSrcEl && overEl.className.indexOf('pinned-item') < 0) {
        var rect = overEl.getBoundingClientRect();
        var next = (touch.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
        document.getElementById('fileList').insertBefore(dragSrcEl, next ? overEl.nextSibling : overEl);
    }
}
function handleDragEnd() {
    if (!dragSrcEl) return;
    dragSrcEl.className = dragSrcEl.className.replace(' dragging', '');
    window.removeEventListener('mousemove', handleDragMove);
    window.removeEventListener('touchmove', handleDragMove);
    window.removeEventListener('mouseup',   handleDragEnd);
    window.removeEventListener('touchend',  handleDragEnd);
    var plName   = currentPath.replace('virtual:list:', '');
    var newOrder = [];
    var items    = document.getElementById('fileList').querySelectorAll('.list-item:not(.pinned-item)');
    for (var i = 0; i < items.length; i++) {
        var t  = items[i].querySelector('.item-title'); if (!t) continue;
        var pl = playlists[plName];
        for (var j = 0; j < pl.length; j++) { if (pl[j].name === t.textContent) { newOrder.push(pl[j]); break; } }
    }
    playlists[plName] = newOrder; savePlaylists(); playList = newOrder;
    if (playMode === 'shuffle') genShuffle();
    dragSrcEl = null;
}
function setupDragSort(el) {
    var handle = el.querySelector('.drag-handle'); if (!handle) return;
    handle.addEventListener('mousedown',  function(e) { handleDragStart(e, el); });
    handle.addEventListener('touchstart', function(e) { handleDragStart(e, el); }, false);
}

// ════════════════ UTILS ══════════════════
function fmtTime(s) {
    if (!s || isNaN(s)) return '--:--';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
}
function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function() { t.style.display = 'none'; }, 1800);
}

// ════════════════════════════════════════════════════
//  LISTENING STATS  (v1.7.2)
//
//  Storage key:  stats_db_v1
//  Structure:    { "YYYY-MM-DD": { "urlKey": { name, url, sec } } }
//
//  Tracking rule: add 1 second every second only when
//    audio is playing  AND  audio.volume >= 0.4  AND  !audio.muted
// ════════════════════════════════════════════════════
var statsDB = {};
var _statsFlushCounter = 0;
var MIN_VOLUME = 0.4;

try { statsDB = JSON.parse(localStorage.getItem('stats_db_v1') || '{}'); } catch(e) {}

// --- Tracking ticker (runs every second) ---
function startStatsTicker() {
    setInterval(function() {
        if (audio.paused) return;
        if (audio.muted || audio.volume < MIN_VOLUME) return;
        var track = playList[currentTrackIndex];
        if (!track) return;

        var today = todayKey();
        if (!statsDB[today]) statsDB[today] = {};
        // Use a short hash of URL as key (to avoid giant keys)
        var k = urlKey(track.url);
        if (!statsDB[today][k]) statsDB[today][k] = { name: track.name, url: track.url, sec: 0 };
        statsDB[today][k].sec += 1;
        // Flush to localStorage every 10 seconds
        _statsFlushCounter++;
        if (_statsFlushCounter >= 10) {
            _statsFlushCounter = 0;
            flushStats();
        }
    }, 1000);
}

function flushStats() {
    try { localStorage.setItem('stats_db_v1', JSON.stringify(statsDB)); } catch(e) {}
}

function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

function dateKey(daysAgo) {
    var d = new Date(); d.setDate(d.getDate() - daysAgo);
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

function urlKey(url) {
    // Simple djb2 hash
    var h = 5381;
    for (var i = 0; i < url.length; i++) h = ((h << 5) + h) ^ url.charCodeAt(i);
    return String(h >>> 0);
}

function pad2(n) { return n < 10 ? '0' + n : String(n); }

function secToHms(s) {
    s = Math.floor(s);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    if (h > 0) return h + '小时 ' + m + '分';
    if (m > 0) return m + '分 ' + sec + '秒';
    return sec + '秒';
}

function secToMin(s) {
    var m = s / 60;
    return m >= 10 ? Math.round(m) + ' 分钟' : m.toFixed(1) + ' 分钟';
}

// --- Open / Close ---
var _statsCurrentTab = 'today';

function openStats() {
    flushStats();
    document.getElementById('statsSheet').className = 'stats-sheet open';
    document.getElementById('statsOverlay').style.display = 'block';
    _statsCurrentTab = 'today';
    // Reset tabs
    var tabs = document.querySelectorAll('.stats-tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].className = 'stats-tab';
    tabs[0].className = 'stats-tab active';
    renderStatsToday();
}

function closeStats() {
    document.getElementById('statsSheet').className = 'stats-sheet';
    document.getElementById('statsOverlay').style.display = 'none';
    flushStats();
}

function switchStatsTab(tab, btn) {
    _statsCurrentTab = tab;
    var tabs = document.querySelectorAll('.stats-tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].className = 'stats-tab';
    btn.className = 'stats-tab active';
    if (tab === 'today')     renderStatsToday();
    else if (tab === '7d')   renderStatsRange(7);
    else if (tab === '30d')  renderStatsRange(30);
    else if (tab === '180d') renderStatsRange(180);
}

// --- TODAY VIEW ---
function renderStatsToday() {
    var body = document.getElementById('statsBody');
    var today = todayKey();
    var dayData = statsDB[today] || {};
    var tracks = [];
    var totalSec = 0;
    var keys = Object.keys(dayData);
    for (var i = 0; i < keys.length; i++) {
        var entry = dayData[keys[i]];
        if (entry.sec > 0) { tracks.push(entry); totalSec += entry.sec; }
    }
    tracks.sort(function(a, b) { return b.sec - a.sec; });

    var html = '';

    // Summary card
    html += '<div class="stats-summary-card">' +
        '<div>' +
            '<div class="stats-summary-label">今日有效听力时长</div>' +
            '<div style="display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;">' +
                '<div class="stats-summary-value">' + Math.floor(totalSec / 60) + '</div>' +
                '<div class="stats-summary-unit">分钟</div>' +
            '</div>' +
            '<div class="stats-summary-sub">' + secToHms(totalSec) + ' · ' + tracks.length + ' 首音频</div>' +
        '</div>' +
        '<div style="font-size:44px;opacity:0.25;">🎧</div>' +
    '</div>';

    if (tracks.length === 0) {
        html += '<div class="stats-empty"><div class="stats-empty-icon">🎵</div>今天还没有听力记录<br><span style="font-size:13px;">开始播放后自动记录（音量≥40%）</span></div>';
    } else {
        var maxSec = tracks[0].sec;
        html += '<div class="stats-section-title">今日播放详情</div>';
        html += '<div class="stats-table">';
        var rankClasses = ['gold','silver','bronze'];
        for (var i = 0; i < tracks.length; i++) {
            var pct = maxSec > 0 ? Math.round((tracks[i].sec / maxSec) * 100) : 0;
            var rc  = i < 3 ? rankClasses[i] : '';
            html += '<div class="stats-row" style="-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:flex-start;align-items:flex-start;">' +
                '<div style="display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;width:100%;">' +
                    '<div class="stats-row-rank ' + rc + '">' + (i+1) + '</div>' +
                    '<div class="stats-row-name">' + escHtml(tracks[i].name) + '</div>' +
                    '<div class="stats-row-time">' + secToMin(tracks[i].sec) + '</div>' +
                '</div>' +
                '<div class="stats-row-bar-wrap" style="margin-left:34px;">' +
                    '<div class="stats-row-bar-fill" style="width:' + pct + '%;"></div>' +
                '</div>' +
            '</div>';
        }
        html += '</div>';
    }

    html += '<div class="stats-notice">⚠️ 仅统计音量≥40%的有效播放时间</div>';
    body.innerHTML = html;
}

// --- RANGE VIEW (7 / 30 / 180 days) ---
function renderStatsRange(days) {
    var body = document.getElementById('statsBody');

    // Build per-day array (most recent last)
    var labels = [], values = [];
    var totalSec = 0;
    var activeDays = 0;
    for (var i = days - 1; i >= 0; i--) {
        var key = dateKey(i);
        var dayData = statsDB[key] || {};
        var s = 0;
        var ks = Object.keys(dayData);
        for (var j = 0; j < ks.length; j++) s += dayData[ks[j]].sec;
        labels.push(key.slice(5)); // MM-DD
        values.push(Math.round(s / 60)); // minutes
        totalSec += s;
        if (s > 0) activeDays++;
    }

    var avgMin = activeDays > 0 ? Math.round((totalSec / 60) / activeDays) : 0;

    var html = '';
    // Summary card
    html += '<div class="stats-summary-card">' +
        '<div>' +
            '<div class="stats-summary-label">近' + days + '日总听力时长</div>' +
            '<div style="display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;">' +
                '<div class="stats-summary-value">' + Math.floor(totalSec / 60) + '</div>' +
                '<div class="stats-summary-unit">分钟</div>' +
            '</div>' +
            '<div class="stats-summary-sub">有记录 ' + activeDays + ' 天 · 日均 ' + avgMin + ' 分钟</div>' +
        '</div>' +
        '<div style="font-size:44px;opacity:0.25;">📈</div>' +
    '</div>';

    // Chart area
    html += '<div class="stats-chart-wrap" id="chartWrap">' +
        '<div class="stats-chart-title">每日听力时长（分钟）</div>' +
        '<canvas id="statsCanvas" height="180"></canvas>' +
        '<div class="stats-chart-tooltip" id="chartTooltip"></div>' +
    '</div>';
    html += '<div class="stats-notice">⚠️ 仅统计音量≥40%的有效播放时间</div>';

    body.innerHTML = html;

    // Draw chart after DOM is ready
    setTimeout(function() { drawLineChart(labels, values, days); }, 30);
}

// --- CANVAS CHART ---
function drawLineChart(labels, values, days) {
    var canvas = document.getElementById('statsCanvas');
    if (!canvas) return;
    var wrap   = document.getElementById('chartWrap');
    var W      = wrap ? wrap.clientWidth - 16 : 300;
    var H      = 180;
    var dpr    = window.devicePixelRatio || 1;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    var PAD_L = 36, PAD_R = 12, PAD_T = 10, PAD_B = 28;
    var cW = W - PAD_L - PAD_R;
    var cH = H - PAD_T - PAD_B;

    var maxVal = 0;
    for (var i = 0; i < values.length; i++) if (values[i] > maxVal) maxVal = values[i];
    if (maxVal === 0) maxVal = 10;

    // Grid lines + Y labels
    ctx.font = '10px -apple-system, sans-serif';
    ctx.fillStyle = '#8e8e93';
    ctx.textAlign = 'right';
    var gridCount = 4;
    for (var gi = 0; gi <= gridCount; gi++) {
        var gVal = Math.round((maxVal / gridCount) * gi);
        var gY   = PAD_T + cH - (cH * gi / gridCount);
        ctx.strokeStyle = 'rgba(0,0,0,0.06)';
        ctx.lineWidth   = 0.5;
        ctx.beginPath(); ctx.moveTo(PAD_L, gY); ctx.lineTo(W - PAD_R, gY); ctx.stroke();
        ctx.fillText(String(gVal), PAD_L - 4, gY + 3);
    }

    // X labels (show ~5 evenly spaced)
    ctx.textAlign = 'center';
    var xStep = Math.ceil(days / 5);
    for (var xi = 0; xi < labels.length; xi++) {
        if (xi % xStep !== 0 && xi !== labels.length - 1) continue;
        var xPos = PAD_L + (xi / (labels.length - 1)) * cW;
        ctx.fillStyle = '#8e8e93';
        ctx.fillText(labels[xi], xPos, H - 6);
    }

    // Build points
    var pts = [];
    for (var i = 0; i < values.length; i++) {
        pts.push({
            x: PAD_L + (i / Math.max(values.length - 1, 1)) * cW,
            y: PAD_T + cH - (values[i] / maxVal) * cH,
            v: values[i], lbl: labels[i]
        });
    }

    // Filled gradient area
    var grad = ctx.createLinearGradient(0, PAD_T, 0, PAD_T + cH);
    grad.addColorStop(0,   'rgba(0,122,255,0.28)');
    grad.addColorStop(0.6, 'rgba(0,122,255,0.05)');
    grad.addColorStop(1,   'rgba(0,122,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, PAD_T + cH);
    ctx.lineTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) {
        // Smooth bezier
        var cpx = (pts[i-1].x + pts[i].x) / 2;
        ctx.bezierCurveTo(cpx, pts[i-1].y, cpx, pts[i].y, pts[i].x, pts[i].y);
    }
    ctx.lineTo(pts[pts.length-1].x, PAD_T + cH);
    ctx.closePath(); ctx.fill();

    // Line
    ctx.strokeStyle = '#007aff';
    ctx.lineWidth   = 2;
    ctx.lineJoin    = 'round';
    ctx.lineCap     = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) {
        var cpx = (pts[i-1].x + pts[i].x) / 2;
        ctx.bezierCurveTo(cpx, pts[i-1].y, cpx, pts[i].y, pts[i].x, pts[i].y);
    }
    ctx.stroke();

    // Dots for non-zero days
    for (var i = 0; i < pts.length; i++) {
        if (pts[i].v === 0) continue;
        ctx.beginPath();
        ctx.arc(pts[i].x, pts[i].y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle   = '#fff';
        ctx.strokeStyle = '#007aff';
        ctx.lineWidth   = 2;
        ctx.fill(); ctx.stroke();
    }

    // Touch / click interaction for tooltip
    var tooltip = document.getElementById('chartTooltip');
    var wrap2   = document.getElementById('chartWrap');

    function showTip(clientX, clientY) {
        var rect   = canvas.getBoundingClientRect();
        var relX   = clientX - rect.left;
        // Find nearest point
        var nearest = null, nearDist = 9999;
        for (var i = 0; i < pts.length; i++) {
            var d = Math.abs(pts[i].x - relX);
            if (d < nearDist) { nearDist = d; nearest = pts[i]; }
        }
        if (!nearest || !tooltip || !wrap2) return;
        var wRect   = wrap2.getBoundingClientRect();
        var tipLeft = nearest.x + wrap2.getBoundingClientRect().left - wRect.left + 8;
        var tipTop  = nearest.y + wrap2.getBoundingClientRect().top  - wRect.top;

        tooltip.textContent = nearest.lbl + '  ' + nearest.v + ' 分钟';
        tooltip.style.left    = (nearest.x + 8) + 'px';
        tooltip.style.top     = (nearest.y + (PAD_T > 0 ? 16 : 16)) + 'px';
        tooltip.style.display = 'block';

        // Draw crosshair
        ctx.clearRect(0, 0, W, H);
        // Redraw everything (just grid + chart) then add crosshair
        drawLineChartBase(ctx, W, H, PAD_L, PAD_R, PAD_T, PAD_B, cW, cH, labels, values, maxVal, pts, days);
        ctx.strokeStyle = 'rgba(0,122,255,0.4)';
        ctx.lineWidth   = 1;
        ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(nearest.x, PAD_T); ctx.lineTo(nearest.x, PAD_T + cH); ctx.stroke();
        ctx.setLineDash([]);
        // Highlighted dot
        ctx.beginPath();
        ctx.arc(nearest.x, nearest.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#007aff'; ctx.fill();
    }

    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        showTip(e.touches[0].clientX, e.touches[0].clientY);
    }, false);
    canvas.addEventListener('touchend', function() {
        if (tooltip) setTimeout(function() { tooltip.style.display = 'none'; }, 1200);
    }, false);
    canvas.addEventListener('mousemove', function(e) { showTip(e.clientX, e.clientY); });
    canvas.addEventListener('mouseleave', function() { if (tooltip) tooltip.style.display = 'none'; });
}

// Re-draw static chart (used during crosshair interaction)
function drawLineChartBase(ctx, W, H, PL, PR, PT, PB, cW, cH, labels, values, maxVal, pts, days) {
    ctx.clearRect(0, 0, W, H);
    // grid
    ctx.font = '10px -apple-system, sans-serif';
    ctx.fillStyle = '#8e8e93'; ctx.textAlign = 'right';
    for (var gi = 0; gi <= 4; gi++) {
        var gVal = Math.round((maxVal / 4) * gi);
        var gY   = PT + cH - (cH * gi / 4);
        ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(PL, gY); ctx.lineTo(W - PR, gY); ctx.stroke();
        ctx.fillText(String(gVal), PL - 4, gY + 3);
    }
    ctx.textAlign = 'center';
    var xStep = Math.ceil(days / 5);
    for (var xi = 0; xi < labels.length; xi++) {
        if (xi % xStep !== 0 && xi !== labels.length - 1) continue;
        var xPos = PL + (xi / (labels.length - 1)) * cW;
        ctx.fillStyle = '#8e8e93'; ctx.fillText(labels[xi], xPos, H - 6);
    }
    // fill
    var grad2 = ctx.createLinearGradient(0, PT, 0, PT + cH);
    grad2.addColorStop(0,   'rgba(0,122,255,0.28)');
    grad2.addColorStop(0.6, 'rgba(0,122,255,0.05)');
    grad2.addColorStop(1,   'rgba(0,122,255,0)');
    ctx.fillStyle = grad2;
    ctx.beginPath(); ctx.moveTo(pts[0].x, PT + cH); ctx.lineTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) {
        var cpx = (pts[i-1].x + pts[i].x) / 2;
        ctx.bezierCurveTo(cpx, pts[i-1].y, cpx, pts[i].y, pts[i].x, pts[i].y);
    }
    ctx.lineTo(pts[pts.length-1].x, PT + cH); ctx.closePath(); ctx.fill();
    // line
    ctx.strokeStyle = '#007aff'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) {
        var cpx = (pts[i-1].x + pts[i].x) / 2;
        ctx.bezierCurveTo(cpx, pts[i-1].y, cpx, pts[i].y, pts[i].x, pts[i].y);
    }
    ctx.stroke();
    // dots
    for (var i = 0; i < pts.length; i++) {
        if (pts[i].v === 0) continue;
        ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#007aff'; ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
    }
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
