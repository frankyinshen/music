<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>英语精听播放器 v1.8.0</title>
    <style>
        :root {
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-text: #000000;
            --ios-subtext: #8e8e93;
            --ios-blue: #007aff;
            --ios-red: #ff3b30;
            --ios-gray-btn: #eef0f4;
            --ios-blur: rgba(255,255,255,0.95);
            --ios-radius: 12px;
            --ios-sep: rgba(0,0,0,0.08);
            --safe-top: env(safe-area-inset-top, 24px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --ios-bg:      #000000;
                --ios-card:    #1c1c1e;
                --ios-text:    #ffffff;
                --ios-subtext: #8e8e93;
                --ios-gray-btn:#2c2c2e;
                --ios-blur:    rgba(28,28,30,0.96);
                --ios-sep:     rgba(255,255,255,0.08);
            }
        }

        @media (prefers-color-scheme: dark) {
            /* Speed wheel gradient masks */
            .speed-wheel-mask.top {
                background: linear-gradient(to bottom, rgba(28,28,30,0.97) 0%, rgba(28,28,30,0) 100%);
            }
            .speed-wheel-mask.bottom {
                background: linear-gradient(to top, rgba(28,28,30,0.97) 0%, rgba(28,28,30,0) 100%);
            }
            /* Stats sheet bg colour already via var(--ios-bg) */
            .st-week-totals { border-top-color: rgba(255,255,255,0.08); }
            .st-week-total-cell:first-child { border-right-color: rgba(255,255,255,0.08); }
            .st-files-header { border-bottom-color: rgba(255,255,255,0.06); }
            .st-file-row { border-bottom-color: rgba(255,255,255,0.04); }
            /* Playlist modal */
            .playlist-modal { background: #1c1c1e; }
            /* Speed sheet */
            .speed-sheet { background: #1c1c1e; }
        }
        html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background-color: var(--ios-bg); color: var(--ios-text);
            -webkit-user-select: none; user-select: none;
            display: -webkit-flex; display: flex;
            -webkit-flex-direction: column; flex-direction: column;
        }

        /* ── HEADER ─────────────────────────────── */
        .header {
            background-color: var(--ios-blur);
            -webkit-backdrop-filter: blur(25px); backdrop-filter: blur(25px);
            padding: calc(var(--safe-top) + 6px) 15px 8px 15px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            z-index: 100; -webkit-flex-shrink: 0; flex-shrink: 0;
        }
        .path-nav {
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: space-between; justify-content: space-between;
            margin-bottom: 8px;
        }
        .back-btn {
            color: var(--ios-blue); font-size: 17px; font-weight: 500;
            background: none; border: none; cursor: pointer;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-tap-highlight-color: transparent; padding: 4px 0;
        }
        .header-stats-btn {
            background: none; border: none; font-size: 22px;
            cursor: pointer; padding: 2px 4px; line-height: 1;
            -webkit-tap-highlight-color: transparent;
            -webkit-flex-shrink: 0; flex-shrink: 0;
        }
        .current-folder {
            font-size: 17px; font-weight: 700;
            max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .search-bar {
            background-color: rgba(118,118,128,0.12); border-radius: 10px;
            padding: 6px 12px;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
        }
        .search-input {
            border: none; background: transparent; width: 100%;
            font-size: 16px; margin-left: 6px; outline: none; -webkit-appearance: none;
        }

        /* ── CONTENT ─────────────────────────────── */
        .content {
            -webkit-flex: 1; flex: 1;
            overflow-y: scroll; -webkit-overflow-scrolling: touch;
            position: relative;
            padding: 10px 16px 295px 16px;
            -webkit-transition: padding-bottom 0.35s ease;
            transition: padding-bottom 0.35s ease;
        }
        body.player-compact .content { padding-bottom: 130px; }

        .list-group { background-color: var(--ios-card); border-radius: var(--ios-radius); overflow: hidden; }
        .list-item {
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            padding: 13px 16px; background-color: var(--ios-card);
            border-bottom: 0.5px solid var(--ios-sep);
            cursor: pointer; position: relative;
            -webkit-tap-highlight-color: rgba(0,0,0,0.05); box-sizing: border-box;
        }
        .list-item:active { background-color: var(--ios-gray-btn); }
        .list-item.active .item-title { color: var(--ios-blue); font-weight: 600; }
        .list-item.pinned-item { background-color: rgba(0,122,255,0.05); }
        .list-item.dragging { opacity: 0.5; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .drag-handle { color: #ccc; margin-right: 12px; font-size: 20px; cursor: grab; padding: 5px; touch-action: none; }
        .item-icon { font-size: 20px; margin-right: 12px; width: 24px; text-align: center; }
        .item-info { -webkit-flex: 1; flex: 1; overflow: hidden; }
        .item-title { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ios-text); }
        .item-subtext { font-size: 11px; color: var(--ios-subtext); margin-top: 2px; }
        .item-fav-heart { padding: 10px; font-size: 20px; color: #ddd; }
        .item-fav-heart.fav-on { color: var(--ios-red); }

        /* ── PLAYER BAR ──────────────────────────── */
        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: var(--ios-card);
            border-top: 0.5px solid var(--ios-sep);
            padding: 10px 0 calc(10px + var(--safe-bottom)) 0;
            z-index: 200; box-shadow: 0 -8px 30px rgba(0,0,0,0.08);
        }
        /* sections hidden when compact */
        .pf {
            overflow: hidden;
            max-height: 200px; opacity: 1;
            -webkit-transition: max-height 0.35s ease, opacity 0.3s ease;
            transition: max-height 0.35s ease, opacity 0.3s ease;
        }
        body.player-compact .pf { max-height: 0; opacity: 0; }

        /* Slider */
        .slider-container { padding: 0 20px; margin-bottom: 5px; }
        .slider-wrapper {
            position: relative; height: 20px;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
        }
        .slider-track-bg {
            position: absolute; left: 0; right: 0;
            height: 5px; background: var(--ios-gray-btn); border-radius: 3px; overflow: hidden;
        }
        .slider-track-fill {
            height: 100%; background: var(--ios-blue); border-radius: 3px; width: 0%;
            -webkit-transition: width 0.1s linear; transition: width 0.1s linear;
        }
        .ios-slider {
            -webkit-appearance: none; position: absolute;
            left: 0; right: 0; width: 100%; height: 20px;
            background: transparent; outline: none; cursor: pointer; margin: 0;
        }
        .ios-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px;
            background: var(--ios-card); border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        /* Track display */
        .track-display { text-align: center; padding: 0 20px; margin-bottom: 5px; }
        .track-name {
            font-size: 16px; font-weight: 700;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--ios-text); margin-bottom: 1px;
        }
        .track-time { font-size: 11px; color: var(--ios-subtext); font-variant-numeric: tabular-nums; margin-bottom: 2px; }
        .audio-info { font-size: 10px; color: #b0b0b8; min-height: 13px; letter-spacing: 0.3px; }

        /* Learning controls */
        .learning-controls {
            display: -webkit-flex; display: flex;
            -webkit-justify-content: center; justify-content: center;
            -webkit-align-items: center; align-items: center;
            margin-bottom: 10px;
        }
        .learn-btn {
            background: none; border: none; color: var(--ios-text); cursor: pointer;
            display: -webkit-flex; display: flex;
            -webkit-flex-direction: column; flex-direction: column;
            -webkit-align-items: center; align-items: center;
            font-size: 10px; font-weight: 600;
            margin: 0 22px; -webkit-tap-highlight-color: transparent; padding: 4px;
        }
        .learn-btn svg { width: 26px; height: 26px; margin-bottom: 2px; pointer-events: none; }
        .learn-btn.active { color: var(--ios-blue); }

        /* Basic controls */
        .basic-controls {
            display: -webkit-flex; display: flex;
            -webkit-justify-content: center; justify-content: center;
            -webkit-align-items: center; align-items: center;
            margin-bottom: 11px;
        }
        .basic-controls > * { margin: 0 10px; }
        .icon-btn {
            background: none; border: none; cursor: pointer; padding: 6px; color: var(--ios-text);
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .icon-btn svg { pointer-events: none; }
        .play-btn svg { width: 44px; height: 44px; }
        .side-btn svg { width: 28px; height: 28px; }
        .icon-btn.active { color: var(--ios-blue); }

        /* ── CYCLE BUTTON badge "1" ─────────────── */
        .cycle-wrap { position: relative; display: inline-block; padding: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; border: none; }
        .cycle-wrap svg { width: 28px; height: 28px; display: block; pointer-events: none; }
        .cycle-badge {
            position: absolute; top: 2px; right: 2px;
            width: 14px; height: 14px; border-radius: 7px;
            background: var(--ios-blue); color: #fff;
            font-size: 9px; font-weight: 800; line-height: 14px; text-align: center;
            display: none; pointer-events: none;
        }
        .cycle-wrap.mode-single { color: var(--ios-blue); }
        .cycle-wrap.mode-single .cycle-badge { display: block; }
        .cycle-wrap.mode-shuffle { color: var(--ios-blue); }

        /* Fav heart */
        .fav-btn {
            font-size: 26px; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            background: none; border: none; padding: 6px;
        }

        /* Feature grid */
        .feature-grid {
            display: -webkit-flex; display: flex;
            -webkit-justify-content: space-around; justify-content: space-around;
            -webkit-align-items: center; align-items: center;
            padding: 0 8px;
        }
        .pill-btn {
            background-color: var(--ios-gray-btn); border: none; border-radius: 8px;
            padding: 7px 0; font-size: 11px; font-weight: 600;
            display: -webkit-flex; display: flex;
            -webkit-flex-direction: column; flex-direction: column;
            -webkit-align-items: center; align-items: center;
            cursor: pointer; width: 18%; -webkit-tap-highlight-color: transparent;
        }
        .pill-btn span { line-height: 1.4; pointer-events: none; }
        .pill-btn.active { background-color: rgba(0,122,255,0.1); color: var(--ios-blue); }
        .version-tag { font-size: 10px; color: #c6c6c8; text-align: center; margin-top: 5px; }

        /* ── SPEED SHEET ─────────────────────────── */
        .sheet-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35); z-index: 500; display: none;
        }
        .speed-sheet {
            position: fixed; left: 0; right: 0; bottom: 0;
            background: var(--ios-card); border-radius: 20px 20px 0 0;
            z-index: 600; display: none;
            -webkit-flex-direction: column; flex-direction: column;
            padding-bottom: calc(16px + var(--safe-bottom));
            -webkit-animation: slideUp 0.3s ease-out; animation: slideUp 0.3s ease-out;
        }
        .speed-sheet.open { display: -webkit-flex; display: flex; }

        .speed-sheet-header {
            display: -webkit-flex; display: flex;
            -webkit-justify-content: space-between; justify-content: space-between;
            -webkit-align-items: center; align-items: center;
            padding: 14px 20px 4px 20px;
        }
        .speed-sheet-title { font-size: 17px; font-weight: 700; }
        .speed-done-btn {
            color: var(--ios-blue); font-size: 17px; font-weight: 600;
            background: none; border: none; cursor: pointer; padding: 4px;
            -webkit-tap-highlight-color: transparent;
        }
        /* live speed badge */
        .speed-live-badge {
            text-align: center; font-size: 28px; font-weight: 700;
            color: var(--ios-blue); padding: 4px 0 8px 0;
            letter-spacing: -0.5px;
        }
        /* Wheel */
        .speed-wheel-wrap { position: relative; height: 200px; overflow: hidden; }
        .speed-wheel-scroll {
            height: 100%; overflow-y: scroll;
            scroll-snap-type: y mandatory; -webkit-scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .speed-wheel-pad { height: 78px; }
        .speed-wheel-option {
            height: 44px;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: center; justify-content: center;
            scroll-snap-align: center;
            font-size: 20px; font-weight: 400; color: var(--ios-text);
        }
        .speed-wheel-option.sel { font-weight: 700; color: var(--ios-blue); font-size: 22px; }
        .speed-wheel-mask {
            position: absolute; left: 0; right: 0; height: 78px; pointer-events: none; z-index: 2;
        }
        .speed-wheel-mask.top {
            top: 0;
            background: -webkit-linear-gradient(top, var(--ios-card) 0%, rgba(0,0,0,0) 100%);
            background: linear-gradient(to bottom, var(--ios-card) 0%, rgba(0,0,0,0) 100%);
        }
        .speed-wheel-mask.bottom {
            bottom: 0;
            background: -webkit-linear-gradient(bottom, var(--ios-card) 0%, rgba(0,0,0,0) 100%);
            background: linear-gradient(to top, var(--ios-card) 0%, rgba(0,0,0,0) 100%);
        }
        .speed-wheel-selector {
            position: absolute; top: 78px; left: 20px; right: 20px; height: 44px;
            border-top: 1px solid rgba(0,0,0,0.15);
            border-bottom: 1px solid rgba(0,0,0,0.15);
            pointer-events: none; z-index: 3; border-radius: 4px;
        }

        /* ── PLAYLIST MODAL ──────────────────────── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); z-index: 1000; display: none;
            -webkit-align-items: flex-end; align-items: flex-end;
            -webkit-justify-content: center; justify-content: center;
        }
        .playlist-modal {
            background: var(--ios-card); width: 100%; max-width: 500px;
            border-radius: 24px 24px 0 0;
            padding: 20px 0 calc(20px + var(--safe-bottom)) 0;
            -webkit-animation: slideUp 0.3s ease-out; animation: slideUp 0.3s ease-out;
        }
        @-webkit-keyframes slideUp { from { -webkit-transform: translateY(100%); } to { -webkit-transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        #toast {
            position: fixed; top: 25%; left: 50%;
            -webkit-transform: translateX(-50%); transform: translateX(-50%);
            background: rgba(0,0,0,0.82); color: white;
            padding: 11px 22px; border-radius: 22px; font-size: 15px;
            z-index: 2000; display: none; white-space: nowrap;
        }
        #noSleepVideo { display: none; width: 1px; height: 1px; }

        /* ══ STATS SHEET (v1.7.3) ══════════════════ */
        .stats-sheet {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--ios-bg); z-index: 900; display: none;
            -webkit-flex-direction: column; flex-direction: column;
        }
        .stats-sheet.open { display: -webkit-flex; display: flex; }

        /* header */
        .st-hdr {
            background: var(--ios-blur);
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            padding: calc(var(--safe-top) + 2px) 16px 10px 16px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            -webkit-flex-shrink: 0; flex-shrink: 0;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: space-between; justify-content: space-between;
        }
        .st-back {
            color: var(--ios-blue); font-size: 16px; font-weight: 600;
            background: none; border: none; cursor: pointer;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-tap-highlight-color: transparent; padding: 4px 0;
        }
        .st-hdr-title { font-size: 17px; font-weight: 700; }
        .st-hdr-spacer { width: 60px; }

        /* scrollable body */
        .st-body {
            -webkit-flex: 1; flex: 1;
            overflow-y: scroll; -webkit-overflow-scrolling: touch;
            padding: 14px 14px calc(30px + var(--safe-bottom)) 14px;
        }

        /* cumulative total card */
        .st-cumul {
            background: var(--ios-card); border-radius: 16px;
            padding: 16px 20px 14px 20px; margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .st-cumul-label { font-size: 14px; font-weight: 700; color: var(--ios-text); margin-bottom: 6px; }
        .st-cumul-value {
            display: -webkit-flex; display: flex;
            -webkit-align-items: flex-end; align-items: flex-end;
        }
        .st-cumul-num { font-size: 38px; font-weight: 700; color: #27ae60; letter-spacing: -1px; line-height: 1; }
        .st-cumul-unit { font-size: 15px; font-weight: 600; color: #27ae60; margin-left: 3px; margin-bottom: 4px; }
        .st-cumul-sub { font-size: 11px; color: var(--ios-subtext); margin-top: 4px; }

        /* week chart card */
        .st-week-card {
            background: var(--ios-card); border-radius: 16px;
            padding: 14px 16px 16px 16px; margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        /* week nav row */
        .st-week-nav {
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: space-between; justify-content: space-between;
            margin-bottom: 14px;
        }
        .st-week-arrow {
            background: none; border: none; cursor: pointer;
            color: var(--ios-blue); font-size: 20px; font-weight: 700;
            padding: 4px 10px; -webkit-tap-highlight-color: transparent;
        }
        .st-week-arrow:disabled { color: #ccc; }
        .st-week-label { font-size: 15px; font-weight: 700; color: var(--ios-text); }
        .st-week-range { font-size: 13px; color: var(--ios-subtext); text-align: center; }

        /* bar chart labels row */
        .st-bar-meta {
            display: -webkit-flex; display: flex;
            -webkit-justify-content: space-between; justify-content: space-between;
            -webkit-align-items: center; align-items: center;
            margin-bottom: 4px;
        }
        .st-bar-meta-l { font-size: 12px; color: var(--ios-subtext); font-weight: 600; }
        .st-bar-meta-r { font-size: 12px; color: var(--ios-subtext); }

        /* canvas bar chart */
        #stBarCanvas { display: block; width: 100%; touch-action: none; }

        /* week totals row */
        .st-week-totals {
            display: -webkit-flex; display: flex;
            border-top: 0.5px solid var(--ios-sep); margin-top: 14px; padding-top: 12px;
        }
        .st-week-total-cell {
            -webkit-flex: 1; flex: 1; text-align: center;
        }
        .st-week-total-cell:first-child {
            border-right: 0.5px solid var(--ios-sep);
        }
        .st-week-total-label { font-size: 12px; color: var(--ios-subtext); font-weight: 600; margin-bottom: 4px; }
        .st-week-total-value { font-size: 18px; font-weight: 700; color: var(--ios-blue); }
        .st-week-compare { font-size: 13px; font-weight: 600; }
        .st-compare-up   { color: #27ae60; }
        .st-compare-down { color: var(--ios-red); }
        .st-compare-same { color: var(--ios-subtext); }

        /* daily files card */
        .st-files-card {
            background: var(--ios-card); border-radius: 16px;
            overflow: hidden; margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .st-files-header {
            display: -webkit-flex; display: flex;
            -webkit-justify-content: space-between; justify-content: space-between;
            -webkit-align-items: center; align-items: center;
            padding: 14px 16px 10px 16px;
            border-bottom: 0.5px solid var(--ios-sep);
        }
        .st-files-title {
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            font-size: 15px; font-weight: 700; color: var(--ios-text);
        }
        .st-files-date { font-size: 13px; color: var(--ios-subtext); }
        .st-file-row {
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            padding: 12px 16px;
            border-bottom: 0.5px solid var(--ios-sep);
        }
        .st-file-row:last-child { border-bottom: none; }
        .st-file-icon {
            width: 42px; height: 42px; border-radius: 10px;
            background: -webkit-linear-gradient(135deg, #f5a623, #f0932b);
            background: linear-gradient(135deg, #f5a623, #f0932b);
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: center; justify-content: center;
            font-size: 20px; margin-right: 12px;
            -webkit-flex-shrink: 0; flex-shrink: 0;
        }
        .st-file-info { -webkit-flex: 1; flex: 1; overflow: hidden; }
        .st-file-name {
            font-size: 15px; font-weight: 600; color: var(--ios-text);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .st-file-dur { font-size: 12px; color: var(--ios-subtext); margin-top: 2px; }
        .st-empty-files {
            text-align: center; padding: 28px 20px;
            color: var(--ios-subtext); font-size: 14px;
        }

        /* notice */
        .st-notice {
            font-size: 11px; color: var(--ios-subtext); text-align: center;
            padding: 0 8px 4px 8px; line-height: 1.6;
        }
    </style>
</head>

<script>
// ════════════════ CONFIG ════════════════
var SITE_ROOT    = 'https://res.evanyin.dpdns.org/';
var AUDIO_EXTS   = ['.mp3','.wav','.flac','.m4a','.aac','.ogg','.opus'];
// Speed options 0.5 → 3.0, step ~0.1-0.25
var SPEED_OPTIONS = [
    0.5, 0.6, 0.7, 0.8, 0.9,
    1.0, 1.1, 1.2, 1.25, 1.3, 1.4, 1.5,
    1.6, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0
];
var WHEEL_ITEM_H = 44;   // px – must match .speed-wheel-option height

// ════════════════ STATE ═════════════════
var currentPath        = SITE_ROOT;
var fileList           = [];
var playList           = [];
var currentTrackIndex  = -1;
// playMode: 'list' | 'single' | 'shuffle'
var playMode           = 'list';
var shuffleOrder       = [];
var playbackRate       = 1.0;
var sleepTimer         = null;
var abA                = null, abB = null;
var isDraggingSlider   = false;
var isWakeLockEnabled  = false;
var wakeLockObj        = null;
var _speedScrollTimer  = null;
var _fileSizeCache     = {};   // url → bytes

var playlists   = {};
var progressDB  = {};
try { playlists  = JSON.parse(localStorage.getItem('my_playlists_v3') || '{}'); } catch(e) {}
try { progressDB = JSON.parse(localStorage.getItem('audio_progress_v2') || '{}'); } catch(e) {}

// ── Last-Session State ────────────────────────────────────────────────────────
// Saves: path the user was browsing + which track was playing + its position.
// On next open, navigates back to that directory, highlights the track,
// and pre-loads it in PAUSED state so the user can just tap ▶ to continue.
var _SESSION_KEY = 'player_last_session_v1';
var _pendingSession = null;   // { trackUrl, trackTime } to apply after directory loads

function saveSession() {
    if (currentTrackIndex < 0 || !playList[currentTrackIndex]) return;
    var track = playList[currentTrackIndex];
    try {
        localStorage.setItem(_SESSION_KEY, JSON.stringify({
            path:      currentPath,
            trackUrl:  track.url,
            trackName: track.name,
            trackTime: audio.currentTime || 0,
            ts:        Date.now()
        }));
    } catch(e) {}
}

function restoreSession() {
    try {
        var raw = localStorage.getItem(_SESSION_KEY);
        if (!raw) return false;
        var s = JSON.parse(raw);
        if (!s || !s.trackUrl || !s.path) return false;
        // Only restore if session was saved within 30 days
        if (Date.now() - (s.ts || 0) > 30 * 86400000) return false;
        _pendingSession = { trackUrl: s.trackUrl, trackTime: s.trackTime || 0, trackName: s.trackName || '' };
        // Navigate to the saved directory (parseDirectory will call _applyPendingSession)
        fetchDirectory(s.path);
        return true;
    } catch(e) { return false; }
}

// Called after parseDirectory populates playList — checks if a session is pending
function _applyPendingSession() {
    if (!_pendingSession) return;
    var ps = _pendingSession;
    _pendingSession = null;
    // Find the track in playList
    var idx = -1;
    for (var i = 0; i < playList.length; i++) {
        if (playList[i].url === ps.trackUrl) { idx = i; break; }
    }
    if (idx < 0) return;   // track no longer exists in directory
    currentTrackIndex = idx;
    var track = playList[idx];
    // Load track into player but do NOT auto-play — let user press ▶
    audio.src = track.url;
    audio.playbackRate = playbackRate;
    document.getElementById('trackName').textContent = track.name;
    updateMediaSession(track);
    document.getElementById('trackTime').textContent = fmtTime(ps.trackTime) + ' / --:--';
    document.getElementById('audioInfo').textContent = '';
    startAudioInfoLoad(track.url);
    renderListHighlight();
    updateFavHeart();
    setCompact(false);   // expand player bar to show the track
    // Seek to saved position once metadata is ready
    var mh = function() {
        audio.removeEventListener('loadedmetadata', mh);
        audio.playbackRate = playbackRate;
        if (ps.trackTime > 2 && audio.duration && !isNaN(audio.duration)) {
            audio.currentTime = ps.trackTime;
        }
        updateAudioInfo();
    };
    audio.addEventListener('loadedmetadata', mh);
    audio.load();
    showToast('上次播放：' + (track.name.length > 16 ? track.name.slice(0,16)+'…' : track.name));
}

var audio     = document.getElementById('audioPlayer');
var slider    = document.getElementById('progressSlider');
var fillEl    = document.getElementById('sliderFill');
var noSleepV  = document.getElementById('noSleepVideo');

// ════════════════ INIT ══════════════════
function init() {
    setupAudioEvents();
    setupSlider();
    buildSpeedWheel();
    setCompact(true);
    startStatsTicker();
    setupMediaSession();
    // Try to restore last session; if none, just load root directory
    if (!restoreSession()) fetchDirectory(currentPath);
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else { init(); }

// ════════════════ COMPACT / EXPANDED ═══
function setCompact(c) {
    document.body.className = c ? 'player-compact' : '';
}

// ════════════════ SLIDER ════════════════
function setupSlider() {
    // HarmonyOS / some Android WebViews fire 'change' but not 'input' during drag.
    // We listen to both; isDraggingSlider prevents double-commit.
    slider.addEventListener('touchstart',   function() { isDraggingSlider = true; }, { passive: true });
    slider.addEventListener('mousedown',    function() { isDraggingSlider = true; });
    slider.addEventListener('pointerdown',  function() { isDraggingSlider = true; });   // HarmonyOS pointer events

    function onSliderMove() {
        isDraggingSlider = true;
        setFill(slider.value);
        if (audio.duration) {
            var t = (slider.value / 100) * audio.duration;
            document.getElementById('trackTime').textContent = fmtTime(t) + ' / ' + fmtTime(audio.duration);
        }
    }
    slider.addEventListener('input',  onSliderMove);
    slider.addEventListener('change', onSliderMove);   // HarmonyOS fallback

    function commitSeek() {
        if (audio.duration) { audio.currentTime = (slider.value / 100) * audio.duration; saveProgress(); }
        isDraggingSlider = false;
    }
    slider.addEventListener('touchend',    commitSeek, false);
    slider.addEventListener('mouseup',     commitSeek);
    slider.addEventListener('pointerup',   commitSeek);   // HarmonyOS pointer events
}
function setFill(pct) { fillEl.style.width = pct + '%'; }

// ════════════════ AUDIO EVENTS ══════════
function setupAudioEvents() {
    audio.addEventListener('play',   function() {
        document.getElementById('iconPlay').style.display  = 'none';
        document.getElementById('iconPause').style.display = 'block';
        setCompact(false);
    });
    audio.addEventListener('pause',  function() {
        document.getElementById('iconPlay').style.display  = 'block';
        document.getElementById('iconPause').style.display = 'none';
        saveProgress();
    });
    audio.addEventListener('ended',  function() {
        clearMediaSession();
        try { delete progressDB[audio.src]; localStorage.setItem('audio_progress_v2', JSON.stringify(progressDB)); } catch(e) {}
        if (playMode === 'single') { playTrack(currentTrackIndex); }
        else { playNext(); }
    });
    audio.addEventListener('timeupdate', onTU);
    audio.addEventListener('durationchange', function() {
        if (audio.duration && !isNaN(audio.duration)) {
            document.getElementById('trackTime').textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
            updateAudioInfo();
        }
    });

    // Polyfill interval: keeps time display alive on iOS 12 where timeupdate misfires
    setInterval(function() {
        if (!audio.paused && !isDraggingSlider && audio.duration && !isNaN(audio.duration)) {
            var pct = (audio.currentTime / audio.duration) * 100;
            slider.value = pct;
            setFill(pct);
            document.getElementById('trackTime').textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
        }
    }, 200);
}

function onTU() {
    if (!audio.duration || isNaN(audio.duration)) return;
    updateMediaPositionState();
    if (!isDraggingSlider) {
        var pct = (audio.currentTime / audio.duration) * 100;
        slider.value = pct;
        setFill(pct);
        document.getElementById('trackTime').textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
    }
    if (abA !== null && abB !== null && audio.currentTime >= abB) audio.currentTime = abA;
}

// ════════════════ PLAY CONTROLS ═════════
// Zero-pad to 2 digits (used for date keys)
function pad2(n) { return n < 10 ? '0' + n : String(n); }
// NotAllowedError = browser blocked autoplay (no user gesture yet)
// AbortError      = normal interruption when switching tracks quickly → ignore silently
function safePlay(targetAudio) {
    return (targetAudio || audio).play().catch(function(e) {
        if (e && e.name === 'NotAllowedError') {
            showToast('请点击播放按钮开始播放');
            // Ensure UI stays in paused state
            document.getElementById('iconPlay').style.display  = 'block';
            document.getElementById('iconPause').style.display = 'none';
        }
        // AbortError and others: silent — normal when switching tracks
    });
}

function togglePlay() {
    if (!audio.src || audio.src === window.location.href) {
        if (playList.length > 0) playTrack(0);
        return;
    }
    if (audio.paused) { safePlay(); }
    else { audio.pause(); }
}


// ════════════════ MEDIA SESSION API ═════
// Enables lock-screen title display and Bluetooth headset controls.
// Only updates metadata here — action handlers are registered once in init().
function updateMediaSession(track) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
        title:  track.name,
        artist: '英语精听播放器',
        album:  currentPath.indexOf('virtual:list:') === 0
                    ? currentPath.replace('virtual:list:', '')
                    : '听力材料'
    });
}

// Register all Media Session action handlers ONCE at startup.
// iOS requires seekbackward/seekforward to be registered before first play,
// and needs setPositionState called on loadedmetadata for them to appear.
function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    var ms = navigator.mediaSession;
    var handlers = [
        ['play',          function() { safePlay(); }],
        ['pause',         function() { audio.pause(); }],
        ['previoustrack', function() { playPrev(); }],
        ['nexttrack',     function() { playNext(); }],
        ['seekbackward',  function(d) { seekRelative(-(d && d.seekOffset ? d.seekOffset : 15)); }],
        ['seekforward',   function(d) { seekRelative(+(d && d.seekOffset ? d.seekOffset : 15)); }],
        ['seekto',        function(d) { if (d && d.seekTime !== undefined && audio.duration) { audio.currentTime = d.seekTime; saveProgress(); } }]
    ];
    for (var i = 0; i < handlers.length; i++) {
        try { ms.setActionHandler(handlers[i][0], handlers[i][1]); } catch(e) {}
    }
}

function clearMediaSession() {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = null;
}

// Keep Media Session position state in sync (for Control Center scrubber)
function updateMediaPositionState() {
    if (!('mediaSession' in navigator) || !audio.duration || isNaN(audio.duration)) return;
    try {
        navigator.mediaSession.setPositionState({
            duration:     audio.duration,
            playbackRate: audio.playbackRate,
            position:     audio.currentTime
        });
    } catch(e) {}
}

function playTrack(index) {
    if (index < 0 || index >= playList.length) return;
    currentTrackIndex = index;
    var track = playList[index];

    audio.src = track.url;
    audio.playbackRate = playbackRate;
    document.getElementById('trackName').textContent = track.name;
    updateMediaSession(track);
    document.getElementById('trackTime').textContent = '--:-- / --:--';
    document.getElementById('audioInfo').textContent = '';

    resetAB();
    updateFavHeart();
    renderListHighlight();
    startAudioInfoLoad(track.url);

    var savedTime = progressDB[track.url] || 0;
    var metaHandler = function() {
        audio.removeEventListener('loadedmetadata', metaHandler);
        audio.playbackRate = playbackRate;   // iOS resets to 1.0 after load()
        if (savedTime > 2 && audio.duration && !isNaN(audio.duration)) {
            audio.currentTime = savedTime;
            showToast('恢复进度: ' + fmtTime(savedTime));
        }
        updateAudioInfo();
        // Trigger lock-screen seek buttons: iOS needs positionState set early
        try {
            navigator.mediaSession && navigator.mediaSession.setPositionState &&
            navigator.mediaSession.setPositionState({
                duration: audio.duration, playbackRate: playbackRate, position: audio.currentTime
            });
        } catch(e) {}
    };
    audio.addEventListener('loadedmetadata', metaHandler);
    audio.load();
    safePlay();
}

function playNext() {
    if (!playList.length) return;
    if (playMode === 'shuffle') {
        var pos = shuffleOrder.indexOf(currentTrackIndex);
        var next = pos + 1;
        if (next >= shuffleOrder.length) {
            genShuffle();   // re-shuffle so next round is never the same order
            next = 0;
        }
        playTrack(shuffleOrder[next]);
    } else {
        playTrack((currentTrackIndex + 1) % playList.length);
    }
}
function playPrev() {
    if (!playList.length) return;
    if (playMode === 'shuffle') {
        var pos = shuffleOrder.indexOf(currentTrackIndex);
        playTrack(shuffleOrder[(pos - 1 + shuffleOrder.length) % shuffleOrder.length]);
    } else {
        playTrack((currentTrackIndex - 1 + playList.length) % playList.length);
    }
}
function seekRelative(sec) {
    if (!audio.duration) return;
    audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec));
    saveProgress();
}

// ════════════════ CYCLE PLAY MODE ═══════
// Cycles: list → single → shuffle → list  (like Apple Music)
function cyclPlayMode() {
    if (playMode === 'list')   { playMode = 'single'; }
    else if (playMode === 'single') { playMode = 'shuffle'; if (!shuffleOrder.length) genShuffle(); }
    else                       { playMode = 'list'; }
    updateCycleBtn();
    var labels = { list:'列表循环', single:'单曲循环', shuffle:'随机播放' };
    showToast(labels[playMode]);
}

function updateCycleBtn() {
    var btn    = document.getElementById('cycleBtn');
    var iList  = document.getElementById('cycleIconList');
    var iSingle= document.getElementById('cycleIconSingle');
    var iShuf  = document.getElementById('cycleIconShuffle');
    var badge  = document.getElementById('cycleBadge');
    // reset
    btn.className    = 'cycle-wrap';
    iList.style.display   = 'none';
    iSingle.style.display = 'none';
    iShuf.style.display   = 'none';
    badge.style.display   = 'none';

    if (playMode === 'list') {
        iList.style.display = 'block';
    } else if (playMode === 'single') {
        btn.className = 'cycle-wrap mode-single';
        iSingle.style.display = 'block';
        badge.style.display   = 'block';
    } else { // shuffle
        btn.className = 'cycle-wrap mode-shuffle';
        iShuf.style.display = 'block';
    }
}

function genShuffle() {
    shuffleOrder = [];
    for (var i = 0; i < playList.length; i++) shuffleOrder.push(i);
    for (var i = shuffleOrder.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = shuffleOrder[i]; shuffleOrder[i] = shuffleOrder[j]; shuffleOrder[j] = tmp;
    }
    // put current track first
    var cur = shuffleOrder.indexOf(currentTrackIndex);
    if (cur > 0) { var t = shuffleOrder[0]; shuffleOrder[0] = shuffleOrder[cur]; shuffleOrder[cur] = t; }
}

// ════════════════ AUDIO INFO ════════════
// Fetches file size via HEAD (or Range request) and pairs with duration to estimate bitrate
// Reads file size via PerformanceResourceTiming (no CORS needed) first,
// then falls back to XHR HEAD / Range for servers that strip timing data.
function startAudioInfoLoad(url) {
    var ext = url.split('.').pop().toUpperCase();
    document.getElementById('audioInfo').textContent = ext + ' · 读取中…';
    if (_fileSizeCache[url]) { updateAudioInfo(); }

    // ── Strategy 1: PerformanceResourceTiming ──────────────────────────
    // The <audio> element's network request appears in the perf buffer.
    // encodedBodySize gives real bytes without any CORS header requirement.
    var perfTries = 0;
    function tryPerf() {
        perfTries++;
        var entries = (window.performance && performance.getEntriesByName)
                        ? performance.getEntriesByName(url, 'resource') : [];
        if (entries.length) {
            var e = entries[entries.length - 1];
            var sz = e.encodedBodySize || e.decodedBodySize || 0;
            if (sz > 512) {         // >512 B means we got a real body size
                _fileSizeCache[url] = sz;
                updateAudioInfo();
                return;
            }
        }
        if (perfTries < 25) setTimeout(tryPerf, 200);   // retry up to ~5 s
        else tryXHR();                                   // give up, fall to XHR
    }

    // ── Strategy 2: XHR HEAD → Range fallback ──────────────────────────
    var xhrDone = false;
    function tryXHR() {
        var xhr = new XMLHttpRequest();
        xhr.open('HEAD', url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4 || xhrDone) return;
            var sz = parseInt(xhr.getResponseHeader('Content-Length') || '0', 10);
            if (sz > 0) { xhrDone = true; _fileSizeCache[url] = sz; updateAudioInfo(); }
            else tryRange();
        };
        xhr.onerror = tryRange;
        try { xhr.send(); } catch(e) { tryRange(); }
    }
    function tryRange() {
        if (xhrDone) return;
        var xhr2 = new XMLHttpRequest();
        xhr2.open('GET', url, true);
        try { xhr2.setRequestHeader('Range', 'bytes=0-0'); } catch(e) {}
        xhr2.onreadystatechange = function() {
            if (xhr2.readyState !== 4 || xhrDone) return;
            var m = (xhr2.getResponseHeader('Content-Range') || '').match(/\/(\d+)/);
            if (m) { xhrDone = true; _fileSizeCache[url] = parseInt(m[1], 10); updateAudioInfo(); }
            else { document.getElementById('audioInfo').textContent = ext; }
        };
        xhr2.onerror = function() { document.getElementById('audioInfo').textContent = ext; };
        try { xhr2.send(); } catch(e) { document.getElementById('audioInfo').textContent = ext; }
    }

    tryPerf();
}

function updateAudioInfo() {
    var url = audio.src;
    if (!url) return;
    var ext  = url.split('.').pop().toUpperCase();
    var dur  = audio.duration;
    var size = _fileSizeCache[url] || 0;

    var parts = [ext];
    if (size > 0 && dur && !isNaN(dur) && dur > 0) {
        var kbps = Math.round((size * 8) / dur / 1000);
        parts.push('~' + kbps + ' kbps');
        parts.push(fmtSize(size));
    } else if (size > 0) {
        parts.push(fmtSize(size));
    }
    document.getElementById('audioInfo').textContent = parts.join(' · ');
}

function fmtSize(b) {
    if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
    if (b >= 1024)    return Math.round(b / 1024) + ' KB';
    return b + ' B';
}

// ════════════════ SPEED WHEEL ═══════════
function buildSpeedWheel() {
    var wheel = document.getElementById('speedWheelScroll');
    wheel.innerHTML = '';
    var pad1 = document.createElement('div'); pad1.className = 'speed-wheel-pad'; wheel.appendChild(pad1);
    for (var i = 0; i < SPEED_OPTIONS.length; i++) {
        var opt = document.createElement('div');
        opt.className = 'speed-wheel-option';
        opt.textContent = fmtSpeed(SPEED_OPTIONS[i]);
        wheel.appendChild(opt);
    }
    var wheelPad = document.createElement('div'); wheelPad.className = 'speed-wheel-pad'; wheel.appendChild(wheelPad);

    // Real-time speed change on scroll – debounced 80ms for smoothness
    wheel.addEventListener('scroll', function() {
        clearTimeout(_speedScrollTimer);
        _speedScrollTimer = setTimeout(applyWheelSpeed, 80);
        // also call immediately for live feel
        applyWheelSpeed();
    }, false);
}

function fmtSpeed(s) {
    return (s % 1 === 0 ? s.toFixed(1) : String(s)) + 'x';
}

function applyWheelSpeed() {
    var wheel = document.getElementById('speedWheelScroll');
    var idx = Math.round(wheel.scrollTop / WHEEL_ITEM_H);
    idx = Math.max(0, Math.min(idx, SPEED_OPTIONS.length - 1));
    var newSpeed = SPEED_OPTIONS[idx];
    document.getElementById('speedLiveBadge').textContent = fmtSpeed(newSpeed);
    // Highlight selected item
    var opts = wheel.querySelectorAll('.speed-wheel-option');
    for (var i = 0; i < opts.length; i++) {
        opts[i].className = 'speed-wheel-option' + (i === idx ? ' sel' : '');
    }
    // Apply in real-time
    if (newSpeed !== playbackRate) {
        playbackRate = newSpeed;
        audio.playbackRate = playbackRate;
        document.getElementById('speedLabel').textContent = fmtSpeed(playbackRate);
        var sBtn = document.getElementById('speedBtn');
        if (sBtn) sBtn.className = 'pill-btn' + (playbackRate !== 1.0 ? ' active' : '');
    }
}

function openSpeedSheet() {
    var wheel = document.getElementById('speedWheelScroll');
    var idx   = SPEED_OPTIONS.indexOf(playbackRate);
    if (idx < 0) idx = SPEED_OPTIONS.indexOf(1.0);
    if (idx < 0) idx = 4; // hard fallback to 1.0x

    // Show the sheet FIRST — scrollTop is ignored while display:none
    document.getElementById('speedOverlay').style.display = 'block';
    document.getElementById('speedSheet').className = 'speed-sheet open';

    // Then set scroll position after the browser has painted the element
    setTimeout(function() {
        wheel.scrollTop = idx * WHEEL_ITEM_H;
        document.getElementById('speedLiveBadge').textContent = fmtSpeed(SPEED_OPTIONS[idx]);
        applyWheelSpeed();
    }, 0);
}

function closeSpeedSheet() {
    document.getElementById('speedOverlay').style.display = 'none';
    document.getElementById('speedSheet').className = 'speed-sheet';
}

// ════════════════ WAKE LOCK ══════════════
function _setWakeLockUI(on) {
    var btn   = document.getElementById('wakeLockBtn');
    var label = document.getElementById('wakeLockLabel');
    if (!btn) return;
    btn.className   = on ? 'pill-btn active' : 'pill-btn';
    label.textContent = on ? '常亮开' : '常亮关';
}

function _requestWakeLock(silent) {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(wl) {
        wakeLockObj = wl;
        // Re-request if system releases the lock (e.g. tab goes background then returns)
        wl.addEventListener('release', function() {
            wakeLockObj = null;
            if (isWakeLockEnabled && document.visibilityState === 'visible') {
                _requestWakeLock(true);
            }
        });
        if (!silent) showToast('已开启屏幕常亮');
    }).catch(function(err) {
        // System denied (low battery mode, power-saving policy, etc.)
        // Roll back UI so button reflects reality
        isWakeLockEnabled = false;
        _setWakeLockUI(false);
        if (!silent) showToast('⚠️ 系统拒绝常亮请求（可能正在省电模式）');
    });
}

function toggleWakeLock() {
    isWakeLockEnabled = !isWakeLockEnabled;
    _setWakeLockUI(isWakeLockEnabled);
    if (isWakeLockEnabled) {
        _requestWakeLock(false);
        noSleepV.play().catch(function(){});
    } else {
        if (wakeLockObj) { try { wakeLockObj.release(); } catch(e){} wakeLockObj = null; }
        noSleepV.pause();
        showToast('已关闭屏幕常亮');
    }
}

// ── Visibility / Background handling ─────────────────────────────────────────
// HarmonyOS 4.x (and iOS) forcibly pause audio when page goes to background.
// We track whether audio was playing so we can offer to resume on return.
var _wasPlayingBeforeHide = false;

document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
        _wasPlayingBeforeHide = !audio.paused;
        saveSession();   // persist state before potential kill
        if (isWakeLockEnabled && wakeLockObj) {
            try { wakeLockObj.release(); } catch(e) {}
            wakeLockObj = null;
        }
    } else {
        // Page became visible again
        if (isWakeLockEnabled) _requestWakeLock(true);
        // HarmonyOS / some Android WebViews pause audio on hide even with wakeLock off.
        // If user was playing, resume automatically.
        if (_wasPlayingBeforeHide && audio.src && audio.paused) {
            safePlay();
        }
    }
});

// pagehide fires on HarmonyOS when the mini-window is swept away
window.addEventListener('pagehide', function() { saveSession(); });
// beforeunload for desktop browsers
window.addEventListener('beforeunload', function() { saveSession(); });

// ════════════════ TIMER ══════════════════
var _sleepTimerEnd  = 0;   // epoch ms when timer fires
var _sleepCountdown = null; // setInterval handle

function _updateTimerLabel() {
    var remaining = Math.max(0, _sleepTimerEnd - Date.now());
    var m = Math.floor(remaining / 60000);
    var s = Math.floor((remaining % 60000) / 1000);
    document.getElementById('timerLabel').textContent =
        m > 0 ? m + '分' + (s < 10 ? '0' : '') + s + '秒'
              : s + '秒';
    if (remaining <= 0) {
        clearInterval(_sleepCountdown);
        _sleepCountdown = null;
        document.getElementById('timerLabel').textContent = '定时';
    }
}

function setTimer() {
    // If timer already running, cancel it
    if (sleepTimer) {
        clearTimeout(sleepTimer);  sleepTimer = null;
        clearInterval(_sleepCountdown); _sleepCountdown = null;
        document.getElementById('timerBtn').className  = 'pill-btn';
        document.getElementById('timerLabel').textContent = '定时';
        showToast('已取消定时');
        return;
    }
    var i = prompt('定时停止（分钟）:', '30');
    if (!i || isNaN(i) || parseFloat(i) <= 0) return;
    var ms = parseFloat(i) * 60000;
    _sleepTimerEnd = Date.now() + ms;
    document.getElementById('timerBtn').className = 'pill-btn active';
    _updateTimerLabel();
    _sleepCountdown = setInterval(_updateTimerLabel, 1000);
    sleepTimer = setTimeout(function() {
        audio.pause();
        clearInterval(_sleepCountdown); _sleepCountdown = null;  sleepTimer = null;
        document.getElementById('timerBtn').className  = 'pill-btn';
        document.getElementById('timerLabel').textContent = '定时';
        showToast('定时停止');
    }, ms);
    showToast('定时 ' + i + ' 分钟后停止（再次点击可取消）');
}

// ════════════════ FAVOURITES ═════════════
function openPlaylistModal() {
    var track = playList[currentTrackIndex];
    if (!track) { showToast('请先播放歌曲'); return; }
    var overlay = document.getElementById('playlistModal');
    overlay.style.display = '-webkit-flex';
    overlay.style.display = 'flex';
    var container = document.getElementById('playlistOptions');
    container.innerHTML = '';
    var keys = Object.keys(playlists);
    for (var k = 0; k < keys.length; k++) {
        (function(name) {
            var opt = document.createElement('div');
            opt.style.cssText = 'padding:16px 25px;border-bottom:0.5px solid #eee;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;font-size:17px;cursor:pointer;';
            var isIn = playlists[name].some(function(f) { return f.url === track.url; });
            opt.innerHTML = '<span style="margin-right:12px;">📁</span><span style="-webkit-flex:1;flex:1;">' + name + '</span>' + (isIn ? '<span style="color:var(--ios-blue);">✓</span>' : '');
            opt.onclick = function() { addToPlaylist(name); };
            container.appendChild(opt);
        })(keys[k]);
    }
}
function closePlaylistModal() { document.getElementById('playlistModal').style.display = 'none'; }

function addToPlaylist(name) {
    var track = playList[currentTrackIndex]; if (!track) return;
    var list = playlists[name];
    var idx  = -1;
    for (var i = 0; i < list.length; i++) { if (list[i].url === track.url) { idx = i; break; } }
    if (idx > -1) { list.splice(idx, 1); showToast('从【' + name + '】移除'); }
    else           { list.push(track);   showToast('已加入【' + name + '】'); }
    savePlaylists(); updateFavHeart(); closePlaylistModal();
    if (currentPath === 'virtual:list:' + name) renderTracksInPlaylist(name);
}

function createNewPlaylistFromModal() {
    var name = prompt('新收藏夹名称:');
    if (name && name.trim()) {
        var c = name.trim();
        if (!playlists[c]) playlists[c] = [];
        addToPlaylist(c);
    }
}

function updateFavHeart() {
    var track = playList[currentTrackIndex];
    var btn   = document.getElementById('mainFavBtn');
    if (!btn) return;
    if (!track) { btn.textContent = '🤍'; return; }
    var keys  = Object.keys(playlists);
    var isIn  = keys.some(function(k) { return playlists[k].some(function(f) { return f.url === track.url; }); });
    btn.textContent = isIn ? '❤️' : '🤍';
}

function toggleQuickFav(e, encoded) {
    e.stopPropagation();
    var track; try { track = JSON.parse(decodeURIComponent(encoded)); } catch(e2) { return; }
    var targets = Object.keys(playlists).filter(function(n) {
        return playlists[n].some(function(f) { return f.url === track.url; });
    });
    if (targets.length > 0) {
        for (var i = 0; i < targets.length; i++) {
            playlists[targets[i]] = playlists[targets[i]].filter(function(f) { return f.url !== track.url; });
        }
        showToast('已取消收藏');
        savePlaylists(); updateFavHeart(); filterList();
    } else {
        var idx = -1;
        for (var i = 0; i < playList.length; i++) { if (playList[i].url === track.url) { idx = i; break; } }
        if (idx > -1) currentTrackIndex = idx;
        openPlaylistModal();
    }
}
function savePlaylists() { try { localStorage.setItem('my_playlists_v3', JSON.stringify(playlists)); } catch(e) {} }

function saveProgress() {
    if (audio.src && audio.currentTime > 0) {
        try { progressDB[audio.src] = audio.currentTime; localStorage.setItem('audio_progress_v2', JSON.stringify(progressDB)); } catch(e) {}
        saveSession();
    }
}

// ════════════════ DIRECTORY ═════════════
function fetchDirectory(url) {
    if (url === 'virtual:folders') { renderPlaylistFolders(); return; }
    if (url.indexOf('virtual:list:') === 0) { renderTracksInPlaylist(url.replace('virtual:list:', '')); return; }
    currentPath = url;
    document.getElementById('fileList').innerHTML = '<div style="text-align:center;padding:20px;color:gray;">连接中...</div>';
    var rawDisp = url.replace(SITE_ROOT, '/');
    if (!rawDisp || rawDisp === '') rawDisp = '/';
    try { rawDisp = decodeURIComponent(rawDisp); } catch(e) {}
    document.getElementById('currentFolder').textContent = rawDisp;

    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
            parseDirectory(xhr.responseText, url);
        } else {
            document.getElementById('fileList').innerHTML = '<div style="padding:20px;color:red;text-align:center;">无法连接服务器 (' + xhr.status + ')</div>';
        }
    };
    xhr.onerror = function() {
        document.getElementById('fileList').innerHTML = '<div style="padding:20px;color:red;text-align:center;">无法连接服务器</div>';
    };
    xhr.send();
}

function parseDirectory(htmlText, baseUrl) {
    var parser = new DOMParser();
    var doc    = parser.parseFromString(htmlText, 'text/html');
    var links  = doc.querySelectorAll('a');
    fileList = []; playList = [];
    for (var i = 0; i < links.length; i++) {
        var a    = links[i];
        var href = a.getAttribute('href');
        var text = a.textContent.trim();
        if (!href || href === '../' || href === './' || text.indexOf('Parent Directory') > -1) continue;
        var fullUrl;
        try { fullUrl = new URL(href, baseUrl).href; } catch(e2) { continue; }
        var name     = decodeURIComponent(text.replace(/[📁📄]/g,'').replace(/\/$/,'').trim());
        var isFolder = href.charAt(href.length - 1) === '/';
        var nLow     = name.toLowerCase();
        var isAudio  = AUDIO_EXTS.some(function(ext) { return nLow.slice(-ext.length) === ext; });
        if (isFolder || isAudio) {
            var item = { name: name, url: fullUrl, isFolder: isFolder, isAudio: isAudio };
            fileList.push(item);
            if (isAudio) playList.push(item);
        }
    }
    if (playMode === 'shuffle') genShuffle();
    renderList(fileList, false);
    _applyPendingSession();   // restore last session if one is pending
}

function renderList(items, isPlaylist) {
    var container = document.getElementById('fileList');
    container.innerHTML = '';

    // Pinned shortcuts
    if (currentPath !== 'virtual:folders' && currentPath.indexOf('virtual:list:') !== 0) {
        appendPinnedItem(container, '⭐️', '我的收藏夹', '', function() { fetchDirectory('virtual:folders'); });
        if (playList.length > 1) {
            var sLabel = playMode === 'shuffle' ? '关闭随机 · 改为列表循环' : '随机播放此目录';
            appendPinnedItem(container, '🔀', sLabel, playList.length + ' 首', function() {
                if (playMode !== 'shuffle') {
                    playMode = 'shuffle';
                    genShuffle();
                    updateCycleBtn();
                    playTrack(shuffleOrder[0]);
                    showToast('随机播放');
                } else {
                    playMode = 'list';
                    updateCycleBtn();
                    showToast('列表循环');
                }
                renderList(items, isPlaylist);
            });
        }
    }

    if (!isPlaylist) {
        items.sort(function(a, b) {
            if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
            return a.name.localeCompare(b.name);
        });
    }

    for (var i = 0; i < items.length; i++) {
        (function(item) {
            var div = document.createElement('div');
            div.className = 'list-item';
            if (currentTrackIndex >= 0 && playList[currentTrackIndex] && playList[currentTrackIndex].url === item.url)
                div.className += ' active';

            var keys  = Object.keys(playlists);
            var isFav = keys.some(function(k) { return playlists[k].some(function(f) { return f.url === item.url; }); });
            var prog  = progressDB[item.url];
            var sub   = (prog && prog > 2) ? '<div class="item-subtext">上次 ' + fmtTime(prog) + '</div>' : '';
            var enc   = encodeURIComponent(JSON.stringify(item));

            div.innerHTML =
                (isPlaylist ? '<div class="drag-handle">≡</div>' : '') +
                '<div class="item-icon">' + (item.isFolder ? '📁' : '🎵') + '</div>' +
                '<div class="item-info"><div class="item-title">' + escHtml(item.name) + '</div>' + sub + '</div>' +
                (item.isAudio ? '<div class="item-fav-heart ' + (isFav ? 'fav-on' : '') + '" onclick="toggleQuickFav(event,\'' + enc + '\')">' + (isFav ? '❤️' : '🤍') + '</div>' : '');

            div.onclick = function(e) {
                var node = e.target || e.srcElement;
                while (node && node !== div) {
                    var cn = node.className || '';
                    if (cn.indexOf('item-fav-heart') > -1 || cn.indexOf('drag-handle') > -1) return;
                    node = node.parentNode;
                }
                if (item.isFolder) {
                    fetchDirectory(item.url);
                } else {
                    var idx = -1;
                    for (var j = 0; j < playList.length; j++) { if (playList[j].url === item.url) { idx = j; break; } }
                    playTrack(idx);
                }
            };
            if (isPlaylist) setupDragSort(div);
            container.appendChild(div);
        })(items[i]);
    }
}

function appendPinnedItem(container, icon, title, sub, onclick) {
    var div = document.createElement('div');
    div.className = 'list-item pinned-item';
    div.innerHTML = '<div class="item-icon">' + icon + '</div><div class="item-info"><div class="item-title">' + title + '</div>' + (sub ? '<div class="item-subtext">' + sub + '</div>' : '') + '</div>';
    div.onclick = onclick;
    container.appendChild(div);
}

function renderListHighlight() {

        items[i].className = items[i].className.replace(' active', '');

        if (t && currentTrackIndex >= 0 && playList[currentTrackIndex] && t.textContent === playList[currentTrackIndex].name)

function renderPlaylistFolders() {
    currentPath = 'virtual:folders';
    document.getElementById('currentFolder').textContent = '/我的收藏';
    var container = document.getElementById('fileList');
    container.innerHTML = '<div class="list-item pinned-item active"><div class="item-icon">⭐️</div><div class="item-info"><div class="item-title">收藏文件夹</div></div></div>';
    var keys = Object.keys(playlists);
    for (var k = 0; k < keys.length; k++) {
        (function(name) {
            var div = document.createElement('div');
            div.className = 'list-item';
            var esc = name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
            div.innerHTML =
                '<div class="item-icon">📁</div>' +

            div.onclick = function() { fetchDirectory('virtual:list:' + name); };
            container.appendChild(div);
        })(keys[k]);
    }
}

// ════════════════ DRAG & DROP ════════════
var dragSrcEl = null;
function handleDragStart(e, el) {
    dragSrcEl = el;
    el.className += ' dragging';
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('touchmove', handleDragMove, false);
    window.addEventListener('mouseup',   handleDragEnd);
    window.addEventListener('touchend',  handleDragEnd, false);
}
function handleDragMove(e) {
    if (!dragSrcEl) return;
    e.preventDefault();
    var touch  = e.type === 'touchmove' ? e.touches[0] : e;
    var target = document.elementFromPoint(touch.clientX, touch.clientY);
    var overEl = null;
    while (target) {
        if (target.className && target.className.indexOf('list-item') > -1) { overEl = target; break; }
        target = target.parentNode;
    }
    if (overEl && overEl !== dragSrcEl && overEl.className.indexOf('pinned-item') < 0) {
        var rect = overEl.getBoundingClientRect();
        var next = (touch.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
        document.getElementById('fileList').insertBefore(dragSrcEl, next ? overEl.nextSibling : overEl);
    }
}
function handleDragEnd() {
    if (!dragSrcEl) return;
    dragSrcEl.className = dragSrcEl.className.replace(' dragging', '');
    window.removeEventListener('mousemove', handleDragMove);
    window.removeEventListener('touchmove', handleDragMove);
    window.removeEventListener('mouseup',   handleDragEnd);
    window.removeEventListener('touchend',  handleDragEnd);
    var plName   = currentPath.replace('virtual:list:', '');
    var newOrder = [];
    var items    = document.getElementById('fileList').querySelectorAll('.list-item:not(.pinned-item)');
    for (var i = 0; i < items.length; i++) {
        var t  = items[i].querySelector('.item-title'); if (!t) continue;
        var pl = playlists[plName];
        for (var j = 0; j < pl.length; j++) { if (pl[j].name === t.textContent) { newOrder.push(pl[j]); break; } }
    }
    playlists[plName] = newOrder; savePlaylists(); playList = newOrder;
    if (playMode === 'shuffle') genShuffle();
    dragSrcEl = null;
}
function setupDragSort(el) {
    var handle = el.querySelector('.drag-handle'); if (!handle) return;
    handle.addEventListener('mousedown',  function(e) { handleDragStart(e, el); });
    handle.addEventListener('touchstart', function(e) { handleDragStart(e, el); }, false);
}

function fmtTime(s) {
    if (!s || isNaN(s)) return '--:--';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
}
